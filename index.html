<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grind">
<meta name="theme-color" content="#0f1117">
<title>Grind</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1117;--surf:#1a1d27;--surf2:#222638;--border:#2e3248;--accent:#4f8ef7;--accent2:#7c5cbf;--green:#3ecf8e;--amber:#f5a623;--red:#e05252;--text:#e8eaf0;--text2:#8b90a7;--text3:#555a73;--r:12px;--r2:8px}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:14px;overflow-x:hidden}
input[type=number]{-webkit-appearance:none;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea,input,select{font-family:inherit}
::-webkit-scrollbar{width:0}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.nav{display:flex;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.nt{flex:1;padding:8px 2px 6px;text-align:center;font-size:9px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.3px;text-transform:uppercase}
.nt.on{color:var(--accent);border-bottom-color:var(--accent)}
.nt .ico{font-size:16px;display:block;margin-bottom:2px}
.page{display:none;padding:12px;padding-bottom:90px;flex:1}
.page.on{display:block}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:6px}
.badge.train{background:rgba(79,142,247,.15);color:var(--accent)}
.badge.off{background:rgba(124,92,191,.15);color:var(--accent2)}
.badge.rest{background:rgba(85,90,115,.3);color:var(--text2)}
.alt-a{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(79,142,247,.15);color:var(--accent)}
.alt-b{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(124,92,191,.15);color:var(--accent2)}
.acl-b{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(62,207,142,.15);color:var(--green)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--surf2);border-radius:var(--r2);padding:12px}
.stat-val{font-size:22px;font-weight:800;color:var(--accent)}
.stat-label{font-size:11px;color:var(--text2);margin-top:1px}
.btn{width:100%;border:none;border-radius:var(--r2);padding:12px;font-size:14px;font-weight:700;cursor:pointer;display:block;text-align:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{opacity:.85}
.btn-resume{background:var(--accent2);color:#fff;margin-bottom:8px}
.btn-save{background:var(--accent);color:#fff;font-size:15px;padding:14px;margin-top:20px}
.btn-green{background:var(--green);color:#fff;padding:10px;font-size:13px;margin-top:10px}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);margin-top:16px}
.btn-ghost{background:var(--surf2);border:1px solid var(--border);color:var(--text2);padding:10px}
.ex-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px}
.ex-row:last-child{border:none}
.ex-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.ex-dot.done{background:var(--green)}
.blk-tag{font-size:10px;color:var(--text3);margin-left:auto;white-space:nowrap}
.bsep{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.bsep-lbl{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.bsep-line{flex:1;height:1px;background:var(--border)}
.ex-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.ex-card.open{border-color:var(--accent)}
.ex-card.done{border-color:var(--green);opacity:.75}
.ex-head{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px}
.ex-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ex-card.done .ex-check{background:var(--green);border-color:var(--green)}
.ex-name{flex:1;font-size:13px;font-weight:600}
.ex-meta{font-size:11px;color:var(--text2)}
.ex-chev{color:var(--text3);font-size:16px;transition:transform .15s;display:inline-block}
.ex-card.open .ex-chev{transform:rotate(180deg)}
.ex-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.ex-card.open .ex-body{display:block}
.note-box{font-size:12px;color:var(--amber);background:rgba(245,166,35,.08);border-radius:var(--r2);padding:8px 10px;margin:10px 0;line-height:1.5}
.acl-box{font-size:12px;color:var(--accent);background:rgba(79,142,247,.08);border-radius:var(--r2);padding:8px 10px;margin:8px 0}
.superset-box{font-size:12px;color:var(--accent2);background:rgba(124,92,191,.08);border-radius:var(--r2);padding:8px 10px;margin:8px 0}
.prev-sessions{margin:10px 0;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.prev-header{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);padding:6px 10px;background:var(--surf2);border-bottom:1px solid var(--border)}
.prev-item{padding:8px 10px;border-bottom:1px solid var(--border)}
.prev-item:last-child{border:none}
.prev-date{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:2px}
.prev-stat{font-size:12px;color:var(--text)}
.prev-comment{font-size:11px;color:var(--accent);font-style:italic;margin-top:2px}
.sets-hdr{display:grid;grid-template-columns:28px 1fr 1fr 60px;gap:6px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 60px;gap:6px;margin-bottom:6px;align-items:center}
.set-num{font-size:12px;color:var(--text2);text-align:center}
.set-inp{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:7px 6px;color:var(--text);font-size:14px;font-weight:600;width:100%;text-align:center}
.set-inp:focus{outline:none;border-color:var(--accent)}
.set-btn{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:7px 4px;color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;width:100%;text-align:center}
.set-btn.done{background:rgba(62,207,142,.15);border-color:var(--green);color:var(--green)}
.add-set-btn{width:100%;background:transparent;border:1px dashed var(--border);border-radius:var(--r2);padding:8px;color:var(--text3);font-size:12px;cursor:pointer;margin-top:2px}
.timer-row{background:var(--surf2);border-radius:var(--r2);padding:10px 12px;margin-top:10px;display:flex;align-items:center;gap:10px}
.timer-disp{font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;min-width:44px}
.timer-lbl{font-size:11px;color:var(--text2)}
.timer-btn{margin-left:auto;background:var(--accent);border:none;border-radius:var(--r2);padding:7px 12px;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.timer-btn.stop{background:var(--red)}
.comment-wrap{margin-top:12px}
.comment-lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.comment-inp{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:9px 10px;color:var(--text);font-size:13px;resize:none;min-height:60px;line-height:1.5}
.comment-inp:focus{outline:none;border-color:var(--accent)}
.comment-saved{font-size:11px;color:var(--green);margin-top:4px;display:none}
.resume-banner{background:rgba(124,92,191,.12);border:1px solid var(--accent2);border-radius:var(--r);padding:14px;margin-bottom:10px}
.hist-item{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.hist-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hist-date{font-size:13px;font-weight:700}
.hist-type{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.hist-sum{font-size:12px;color:var(--text2)}
.hist-comment{font-size:11px;color:var(--accent);font-style:italic;margin-top:4px;background:var(--surf2);border-radius:var(--r2);padding:5px 8px;border-left:2px solid var(--accent)}
.api-box{background:rgba(245,166,35,.08);border:1px solid var(--amber);border-radius:var(--r);padding:14px;margin-bottom:14px}
.api-inp{width:100%;background:var(--surf);border:1px solid var(--border);border-radius:var(--r2);padding:10px;color:var(--text);font-size:12px;font-family:monospace;margin-bottom:8px}
.api-inp:focus{outline:none;border-color:var(--accent)}
.api-save{width:100%;background:var(--accent);border:none;border-radius:var(--r2);padding:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.quick-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.quick-btn{background:var(--surf2);border:1px solid var(--border);border-radius:20px;padding:6px 10px;font-size:11px;color:var(--text2);cursor:pointer}
.chat-wrap{display:flex;flex-direction:column;min-height:180px;max-height:360px;overflow-y:auto;margin-bottom:10px}
.msg-user{max-width:86%;background:var(--accent);color:#fff;border-radius:12px 12px 3px 12px;padding:10px 12px;font-size:13px;line-height:1.6;margin-left:auto;margin-bottom:8px;word-break:break-word}
.msg-coach{max-width:86%;background:var(--surf2);color:var(--text);border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:8px;word-break:break-word}
.chat-inp-row{display:flex;gap:8px}
.chat-inp{flex:1;background:var(--surf);border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;color:var(--text);font-size:13px;resize:none;height:42px}
.chat-inp:focus{outline:none;border-color:var(--accent)}
.chat-send{background:var(--accent);border:none;border-radius:var(--r2);padding:10px 14px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.chat-send:disabled{opacity:.4}
.srow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border:none}
.slbl{font-size:14px;font-weight:600}
.ssub{font-size:11px;color:var(--text2);margin-top:1px}
.sval{font-size:12px;color:var(--text2);font-weight:600}
.status-on{color:var(--green);font-size:12px;font-weight:700}
.status-warn{color:var(--amber);font-size:12px;font-weight:700}
.phase-toggle{display:flex;background:var(--surf2);border-radius:var(--r2);padding:3px;margin-bottom:12px;border:1px solid var(--border)}
.phase-opt{flex:1;padding:7px 2px;text-align:center;font-size:9px;font-weight:700;color:var(--text2);border-radius:6px;cursor:pointer;letter-spacing:.3px}
.phase-opt.on{background:var(--accent);color:#fff}
.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.export-btn{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:10px 8px;font-size:11px;color:var(--text2);cursor:pointer;text-align:center;line-height:1.6}
.autosave-bar{font-size:11px;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.autosave-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.empty{text-align:center;padding:50px 20px;color:var(--text2)}
.empty-icon{font-size:36px;margin-bottom:10px}
/* CHARTS */
.chart-select{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;color:var(--text);font-size:14px;margin-bottom:12px;appearance:none;-webkit-appearance:none}
.chart-select:focus{outline:none;border-color:var(--accent)}
.range-toggle{display:flex;background:var(--surf2);border-radius:var(--r2);padding:3px;margin-bottom:14px;border:1px solid var(--border)}
.range-opt{flex:1;padding:6px 2px;text-align:center;font-size:10px;font-weight:700;color:var(--text2);border-radius:6px;cursor:pointer}
.range-opt.on{background:var(--accent);color:#fff}
.chart-wrap{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;overflow:hidden}
.chart-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.chart-empty{text-align:center;padding:30px;color:var(--text3);font-size:13px}
.chart-axis-label{font-size:9px;fill:#8b90a7}
.chart-line-weight{stroke:#4f8ef7;stroke-width:2;fill:none}
.chart-line-reps{stroke:#3ecf8e;stroke-width:2;fill:none}
.chart-dot-weight{fill:#4f8ef7}
.chart-dot-reps{fill:#3ecf8e}
.chart-legend{display:flex;gap:12px;margin-top:8px}
.chart-legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)}
.chart-legend-dot{width:8px;height:8px;border-radius:50%}
.vol-bar{fill:rgba(79,142,247,.6)}
.vol-bar:hover{fill:var(--accent)}
</style>
</head>
<body>
<div id="app">
<nav class="nav">
  <div class="nt on" data-tab="dash" onclick="switchTab('dash')"><span class="ico">⊞</span>Today</div>
  <div class="nt" data-tab="workout" onclick="switchTab('workout')"><span class="ico">🏋</span>Workout</div>
  <div class="nt" data-tab="history" onclick="switchTab('history')"><span class="ico">📋</span>History</div>
  <div class="nt" data-tab="charts" onclick="switchTab('charts')"><span class="ico">📈</span>Charts</div>
  <div class="nt" data-tab="coach" onclick="switchTab('coach')"><span class="ico">🧠</span>Coach</div>
  <div class="nt" data-tab="settings" onclick="switchTab('settings')"><span class="ico">⚙</span>Settings</div>
</nav>
<div class="page on" id="p-dash"></div>
<div class="page" id="p-workout"></div>
<div class="page" id="p-history"></div>
<div class="page" id="p-charts"></div>
<div class="page" id="p-coach"></div>
<div class="page" id="p-settings"></div>
</div>

<script>
// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const SK = 'grind_v4';
const SEK = 'grind_sess_v4';
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const PHASES = [{label:'Weeks 1–4',name:'Foundation'},{label:'Weeks 5–8',name:'Strength'},{label:'Weeks 9–12',name:'Power'},{label:'Weeks 13–16',name:'Performance'}];

// ─── PROGRAM DATA ─────────────────────────────────────────────────────────────
const PROG = {
  warmup:[
    {n:'Leg swings — front and side',m:'10 each leg',note:'Hold wall for balance. Full range of motion.'},
    {n:'Hip circles',m:'10 each direction',note:'Slow and deliberate.'},
    {n:'Cat camels',m:'10 reps',note:'Full spinal flexion and extension.'},
    {n:'Squat sky reaches',m:'10 reps',note:'Deep squat, arms reaching overhead.'},
    {n:'Wrist prep',m:'30 seconds',note:'Circles and floor stretches. Important for TRX and L-sit.'},
    {n:'Dead bug',m:'30 seconds',note:'Core activation. Flatten back completely.'},
  ],
  b1:[
    {n:'Tibialis raises — standing',m:'1×15–20 reps',s:1,r:18,w:0,note:'Activation set. Standing wall version. Toes up.'},
    {n:'Tibialis raises — seated weighted',m:'2×10–12 reps',s:2,r:10,w:15,note:'Leg straight extended. 15lb on foot or shin. Strength sets.'},
    {n:'Patrick step — elevated platform',m:'3×10 each leg',s:3,r:10,w:0,acl:true,note:'4–5 inch platform. 4–5 sec down. Heel stays flat throughout. ACL leg first.'},
    {n:'Isometric knee forward hold',m:'3–5 holds × 5 sec each leg',s:3,r:5,w:0,acl:true,note:'Max effort 5-sec push. Knee over toes, heel grounded. 10 sec rest between pushes. Do during Patrick step rest periods.'},
  ],
  sqA:{n:'ATG split squat',m:'3×8 each leg',s:3,r:8,w:0,acl:true,alt:'A',note:'ACL leg forward on platform. Front heel stays flat — if rising shorten stance. Back knee toward floor. 2 sec pause at bottom on ACL leg. Started at 18", progressing to 12" platform.'},
  sqB:{n:'Hack squat (Hackenschmidt)',m:'3×8–10 reps',s:3,r:8,w:10,alt:'B',note:'KB behind legs. 4 sec down, 1 hold, drive up. Hand on outer quad of ACL leg to cue vastus lateralis.'},
  rdlA:{n:'Single leg RDL',m:'3×8 each leg',s:3,r:8,w:20,acl:true,alt:'A',note:'ACL leg planted first. Weight same side as lifted leg. Do not add weight if ACL leg lags.'},
  rdlB:{n:'Barbell RDL',m:'3×8 reps',s:3,r:8,w:70,alt:'B',note:'Bilateral. 3 sec down. Never round lower back. Check ACL leg pulls equal load.'},
  b2A:[
    {n:'Pull ups',m:'3×5 reps',s:3,r:5,w:0,superset:true,note:'SUPERSET with TRX rows — do pull ups then immediately TRX rows, rest 90 sec, repeat. All reps unassisted — fully achieved. Use fixed bar on squat rack not the Cybex cable bar.'},
    {n:'TRX rows',m:'3×8–10 reps',s:3,r:8,w:0,superset:true,note:'SUPERSET with pull ups — do immediately after pull ups each round. More horizontal = harder. Retract shoulder blades at top.'},
  ],
  b2B:[
    {n:'Pike push ups',m:'3×5–8 reps',s:3,r:6,w:0,note:'Hips high, hands shoulder width, head toward floor. Full range. Handstand foundation.'},
    {n:'Dips — progressive',m:'3 sets',s:3,r:8,w:0,note:'Wk5: 8 reps BW. Wk6: 10 reps. Wk7: light weight. Full lockout top, full depth bottom.'},
  ],
  b3:[
    {n:'Dead bug with weight',m:'3×10 reps',s:3,r:10,w:20,note:'Both legs extended. Lower back FLAT throughout. If back arches — reduce weight.'},
    {n:'Copenhagen plank — knee version',m:'3×20 sec each side',s:3,r:20,w:0,acl:true,note:'Top knee on bench — use 20 inch platform. Stack hips vertically. Add 5 sec per week. Target 35 sec by week 8.'},
    {n:'Hyperextensions',m:'3×10–12 reps',s:3,r:10,w:0,note:'2 sec up, 1 hold, 2 sec down. Squeeze glutes at top. Also doing isometric cantilever hold variation — 40 sec holds. Mild lower back stiffness in first sessions is normal.'},
  ],
  skill:[
    {n:'Wrist warm up',m:'2 minutes',note:'Circles both directions, forward and backward stretches. Never skip.'},
    {n:'L-sit — both legs straight',m:'3–4×build to 20 sec',s:4,r:20,w:0,note:'Press DOWN hard. Both legs straight, 20 sec hold + 10 rep raises each set.'},
    {n:'L-sit — single leg extended',m:'3×5–8 reps each',s:3,r:6,w:0,note:'One leg straight out, one tucked. Alternate.'},
  ],
  forearm:[
    {n:'Wrist curls',m:'3×10 reps',s:3,r:10,w:12,note:'Forearm on thigh, curl wrist upward.'},
    {n:'Reverse wrist curls',m:'3×10 reps',s:3,r:10,w:12,note:'Same position, curl wrist downward.'},
    {n:'Wrist rotation with dumbbell',m:'3×12 reps',s:3,r:12,w:12,note:'Neutral grip. Rotate wrist through full range. Both directions.'},
    {n:'Brachioradialis raises — neutral grip',m:'3×12 reps',s:3,r:12,w:12,note:'Neutral grip dumbbell or cable raise. Directly targets brachioradialis. Keep elbow tucked.'},
    {n:'Farmers hold',m:'3×40 sec',s:3,r:40,w:53,note:'53lb each hand (106lb total). Progress to 45 sec before adding weight. Grip endurance transfers to pull ups and L-sit.'},
    {n:'Single leg calf raises — straight',m:'3×8 each leg',s:3,r:8,w:45,acl:true,note:'ACL leg first. 2×45lb. Gastrocnemius. Try different foot angles — straight, inward, outward across sets.'},
  ],
  altA:{n:'Bent knee calf raises',m:'3×12–15 reps',s:3,r:12,w:0,alt:'A',note:'Soleus focus. Knee bent 90°. Do after straight leg raises while muscle is warm.'},
  altB:{n:'Hip flexor KB raise',m:'3×10 each leg',s:3,r:10,w:0,acl:true,alt:'B',note:'KB locked on foot. Drive knee up. Hold at top. Start lightest KB. Also use Hoist captain\'s chair for knee raises — direct L-sit carryover.'},
  hiit:[{n:'HIIT — Spin bike (Johnny G Spirit)',m:'~10 min total',note:'2 min warmup → 6 rounds 20 sec hard / 40 sec easy → 1 min cool down. Fasted. Effort from cadence not resistance.'}],
  ball:[{n:'Basketball — Option 2',m:'20–30 min',note:'70% shooting: self-pass catch and shoot, corner spots, bank shots, free throws. 30%: figure 8 dribble, weak hand, slow pull-up jumpers, Mikan drill.'}],
  cycling:[{n:'Steady cycling',m:'10–15 min',note:'65–75% max heart rate. Consistent pace — not HIIT, not easy cruise. 60–65 rpm for endurance. Warms muscles before stretching.'}],
  stretch:[
    {n:'Couch stretch',m:'60 sec each side',note:'Hip flexors. Highest priority for ACL mechanics and squat depth.'},

// ─── STATE ────────────────────────────────────────────────────────────────────
let ST = {apiKey:'', trainAltIndex:0, offAltIndex:0, sessions:[], chat:[], phase:1};
let SESS = {active:false, exDone:{}, setData:{}, startTime:null};
let timers = {};
let extraSets = {};

function getDT(d) {
  const w = (d||new Date()).getDay();
  if(w===0)return'rest';
  if(w===1||w===3||w===5)return'training';
  if(w===2)return'hiit';
  if(w===4)return'ball';
  return'stretch';
}
function altV(){return ST.trainAltIndex%2===0?'A':'B';}
function rdlV(){return ST.trainAltIndex%2===0?'single':'barbell';}
function offAltV(){return ST.offAltIndex%2===0?'A':'B';}

// ─── STORAGE ──────────────────────────────────────────────────────────────────
function persist(){
  try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){}
  try{localStorage.setItem(SEK,JSON.stringify(SESS));}catch(e){}
}

function loadData(){
  try{const s=localStorage.getItem(SK);if(s)ST={...ST,...JSON.parse(s)};}catch(e){}
  try{const s=localStorage.getItem(SEK);if(s){const d=JSON.parse(s);if(d.active)SESS={...SESS,...d};}}catch(e){}
}

// ─── LAST TWO SESSIONS PER EXERCISE ──────────────────────────────────────────
function getLastTwoForExercise(exId) {
  const results = [];
  for(let i = ST.sessions.length-1; i >= 0 && results.length < 2; i--) {
    const sess = ST.sessions[i];
    if(sess.exData && sess.exData[exId]) {
      results.push({date: sess.date, type: sess.type, data: sess.exData[exId], comment: sess.comments?.[exId]||''});
    }
  }
  return results;
}

function prevSessionsHtml(exId) {
  const prev = getLastTwoForExercise(exId);
  if(!prev.length) return '';
  const items = prev.map(p => {
    const d = new Date(p.date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const bestSet = p.data.sets ? p.data.sets.reduce((best,s) => {
      const w = parseFloat(s.w)||0; const r = parseInt(s.r)||0;
      return (w > (parseFloat(best.w)||0) || (w===(parseFloat(best.w)||0) && r>(parseInt(best.r)||0))) ? s : best;
    }, p.data.sets[0]||{}) : null;
    const statStr = bestSet ? `Best set: ${bestSet.r||'—'} reps${bestSet.w?` @ ${bestSet.w}lb`:''}` : '';
    return `<div class="prev-item">
      <div class="prev-date">${d} — ${p.type.split('—')[0].trim()}</div>
      ${statStr?`<div class="prev-stat">${statStr}</div>`:''}
      ${p.comment?`<div class="prev-comment">📝 ${p.comment}</div>`:''}
    </div>`;
  }).join('');
  return `<div class="prev-sessions"><div class="prev-header">Last ${prev.length} session${prev.length>1?'s':''}</div>${items}</div>`;
}

// ─── NAV ──────────────────────────────────────────────────────────────────────
function switchTab(id) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nt').forEach(t=>t.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  document.querySelector(`[data-tab="${id}"]`).classList.add('on');
  if(id==='dash')renderDash();
  if(id==='workout')renderWorkout();
  if(id==='history')renderHistory();
  if(id==='charts')renderCharts();
  if(id==='coach')renderCoach();
  if(id==='settings')renderSettings();
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function fmtTime(id){const s=timers[id]?.secs!==undefined?timers[id].secs:90;if(s<=0)return'Go!';return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');}
function calcStreak(){if(!ST.sessions.length)return 0;let streak=0;const t=new Date();t.setHours(0,0,0,0);let c=new Date(t);for(let i=ST.sessions.length-1;i>=0;i--){const d=new Date(ST.sessions[i].date);d.setHours(0,0,0,0);if(d.getTime()===c.getTime()){streak++;c.setDate(c.getDate()-1);}else if(d.getTime()<c.getTime())break;}return streak;}
function bsep(label){return`<div class="bsep"><div class="bsep-lbl">${label}</div><div class="bsep-line"></div></div>`;}
function altBadge(a){return`<span class="${a==='A'?'alt-a':'alt-b'}">${a}</span>`;}

// ─── EXERCISE CARD ────────────────────────────────────────────────────────────
function saveComment(id,val){SESS.setData[`${id}-comment`]=val;persist();const el=document.getElementById(`cs-${id}`);if(el){el.style.display='block';setTimeout(()=>{el.style.display='none';},1200);}}

function exCard(ex, id) {
  const isDone = !!SESS.exDone[id];
  const hasSets = ex.s && ex.s > 0;
  const extra = extraSets[id]||0;
  const total = (ex.s||0)+extra;
  const comment = SESS.setData[`${id}-comment`]||'';
  const prev = prevSessionsHtml(id);

  let setsHtml = '';
  if(hasSets) {
    setsHtml += `<div class="sets-hdr"><div>Set</div><div>Reps</div><div>Wt (lb)</div><div>Done</div></div>`;
    for(let i=0;i<total;i++){
      const done=!!SESS.setData[`${id}-${i}-done`];
      const reps=SESS.setData[`${id}-${i}-reps`]||'';
      const wt=SESS.setData[`${id}-${i}-wt`]||'';
      setsHtml+=`<div class="set-row"><div class="set-num">${i+1}</div><input class="set-inp" type="number" inputmode="numeric" placeholder="${ex.r||'—'}" value="${reps}" onchange="setVal('${id}',${i},'reps',this.value)"><input class="set-inp" type="number" inputmode="decimal" placeholder="${ex.w!==undefined?ex.w:'—'}" value="${wt}" onchange="setVal('${id}',${i},'wt',this.value)"><button class="set-btn${done?' done':''}" onclick="toggleSetDone('${id}',${i})">${done?'✓':'Done'}</button></div>`;
    }
    setsHtml+=`<button class="add-set-btn" onclick="addSet('${id}')">+ Add set</button>`;
    setsHtml+=`<div class="timer-row"><div><div class="timer-disp" id="td-${id}">${fmtTime(id)}</div><div class="timer-lbl">Rest timer</div></div><button class="timer-btn${timers[id]?.running?' stop':''}" id="tb-${id}" onclick="toggleTimer('${id}')">${timers[id]?.running?'Stop':timers[id]?.secs===0?'Reset':'Start'}</button></div>`;
  }

  return `<div class="ex-card${isDone?' done':''}" id="ec-${id}">
    <div class="ex-head" onclick="toggleEx('${id}')">
      <div class="ex-check">${isDone?'<span style="color:#fff;font-size:11px">✓</span>':''}</div>
      <div style="flex:1">
        <div class="ex-name">${ex.n}${ex.alt?altBadge(ex.alt):''}${ex.superset?'<span style="font-size:9px;color:#7c5cbf;margin-left:4px;font-weight:700">SUPER</span>':''}</div>
        <div class="ex-meta">${ex.m}${comment?'<span style="color:var(--accent);font-size:10px;margin-left:4px">📝</span>':''}</div>
      </div>
      <span class="ex-chev">⌄</span>
    </div>
    <div class="ex-body">
      ${prev}
      ${ex.note?`<div class="note-box">📋 ${ex.note}</div>`:''}
      ${ex.acl?'<div class="acl-box">⚡ ACL leg always goes first — every set, no exceptions.</div>':''}
      ${ex.superset?'<div class="superset-box">🔗 Superset — do this exercise then immediately the paired exercise, then rest 90 sec.</div>':''}
      ${setsHtml}
      <div class="comment-wrap">
        <div class="comment-lbl">📝 Session note</div>
        <textarea class="comment-inp" placeholder="e.g. 12 inch platform, heel stayed flat, ACL leg felt stronger..." oninput="saveComment('${id}',this.value)">${comment}</textarea>
        <div class="comment-saved" id="cs-${id}">✓ Saved</div>
      </div>
      <button class="btn btn-green" onclick="markDone('${id}')">✓ Mark complete</button>
    </div>
  </div>`;
}

function toggleEx(id){const card=document.getElementById('ec-'+id);if(!card)return;const isOpen=card.classList.contains('open');document.querySelectorAll('.ex-card.open').forEach(c=>c.classList.remove('open'));if(!isOpen){card.classList.add('open');card.scrollIntoView({behavior:'smooth',block:'nearest'});}}
function setVal(id,idx,field,val){SESS.setData[`${id}-${idx}-${field}`]=val;persist();}
function toggleSetDone(id,idx){const key=`${id}-${idx}-done`;SESS.setData[key]=!SESS.setData[key];persist();const btn=document.getElementById(`ec-${id}`)?.querySelectorAll('.set-btn')[idx];if(btn){btn.classList.toggle('done',!!SESS.setData[key]);btn.textContent=SESS.setData[key]?'✓':'Done';}}
function addSet(id){extraSets[id]=(extraSets[id]||0)+1;renderWorkout();setTimeout(()=>{const c=document.getElementById('ec-'+id);if(c){c.classList.add('open');}},50);}
function markDone(id){SESS.exDone[id]=true;persist();const card=document.getElementById('ec-'+id);if(card){card.classList.add('done');card.classList.remove('open');const ck=card.querySelector('.ex-check');if(ck)ck.innerHTML='<span style="color:#fff;font-size:11px">✓</span>';}const dot=document.querySelector(`[data-ex="${id}"]`);if(dot)dot.classList.add('done');}

// ─── TIMER ────────────────────────────────────────────────────────────────────
function toggleTimer(id){
  if(timers[id]?.running){clearInterval(timers[id].iv);timers[id]={running:false,secs:90};const btn=document.getElementById('tb-'+id);const disp=document.getElementById('td-'+id);if(btn){btn.textContent='Start';btn.classList.remove('stop');}if(disp)disp.textContent='1:30';return;}
  let s=90;timers[id]={running:true,secs:90};const btn=document.getElementById('tb-'+id);if(btn){btn.textContent='Stop';btn.classList.add('stop');}
  timers[id].iv=setInterval(()=>{s--;timers[id].secs=s;const disp=document.getElementById('td-'+id);if(disp)disp.textContent=s<=0?'Go!':Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');if(s<=0){clearInterval(timers[id].iv);timers[id].running=false;const b=document.getElementById('tb-'+id);if(b){b.textContent='Reset';b.classList.remove('stop');}}},1000);
}

// ─── SESSION ──────────────────────────────────────────────────────────────────
function startSession(){SESS={active:true,exDone:{},setData:{},startTime:new Date().toISOString()};extraSets={};persist();switchTab('workout');}

function collectExData() {
  const exData = {};
  const allExIds = ['wu0','wu1','wu2','wu3','wu4','wu5','b10','b11','b12','b13','sq0','rdl0','b20','b21','b30','b31','b32','sk0','sk1','sk2','fa0','fa1','fa2','fa3','fa4','fa5','alt0','hi0','ba0','cy0','st0','st1','st2','st3','st4','st5','st6','st7','st8'];
  allExIds.forEach(id => {
    const sets = [];
    for(let i=0; i<20; i++) {
      const reps = SESS.setData[`${id}-${i}-reps`];
      const wt = SESS.setData[`${id}-${i}-wt`];
      const done = SESS.setData[`${id}-${i}-done`];
      if(reps||wt||done) sets.push({r:reps||'',w:wt||'',done:!!done});
    }
    if(sets.length || SESS.exDone[id]) exData[id] = {sets, done: !!SESS.exDone[id]};
  });
  return exData;
}

function finishSession(){
  const dt=getDT();const av=altV();
  const type=dt==='training'?`Training — ${av==='A'?'ATG/Pull ups':'Hack/Pike push ups'}`:dt==='hiit'?'HIIT + Skill':dt==='ball'?'Basketball + Skill':'Stretch + Skill';
  const comments={};Object.keys(SESS.setData).forEach(k=>{if(k.endsWith('-comment')&&SESS.setData[k])comments[k.replace('-comment','')]=SESS.setData[k];});
  const exData = collectExData();
  ST.sessions.push({date:new Date().toISOString(),type,exCount:Object.keys(SESS.exDone).length,comments,exData});
  if(dt==='training')ST.trainAltIndex++;
  else if(dt!=='rest')ST.offAltIndex++;
  SESS={active:false,exDone:{},setData:{},startTime:null};extraSets={};persist();
  switchTab('dash');setTimeout(()=>alert('Session saved. Great work.'),100);
}

  else if(dt==='hiit'){badge='off';title='HIIT + skill + accessory';sub='HIIT · L-sit · Forearm + calf';rows=[{n:'L-sit skill work',b:'Skill',id:'sk1'},{n:'Wrist curls + Raises + Farmers hold',b:'Access',id:'fa0'},{n:'Single leg calf raises',b:'Access',id:'fa5',acl:true},{n:offAlt,b:'Access',id:'alt0',alt:offAltV()},{n:'HIIT — Spin bike',b:'Cardio',id:'hi0'}];}
  else if(dt==='stretch'){badge='off';title='Stretch + skill + accessory';sub='Cycling · Stretch · L-sit · Forearm + calf';rows=[{n:'Steady cycling 10–15 min',b:'Cardio',id:'cy0'},{n:'Deep stretch (9 stretches)',b:'Stretch',id:'st0'},{n:'L-sit skill work',b:'Skill',id:'sk1'},{n:'Wrist curls + Raises + Farmers hold',b:'Access',id:'fa0'},{n:'Single leg calf raises',b:'Access',id:'fa5',acl:true},{n:offAlt,b:'Access',id:'alt0',alt:offAltV()}];}

  document.getElementById('p-dash').innerHTML=`

    <div style="font-size:11px;color:var(--text2);margin-bottom:4px">${today.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
    <div class="card"><span class="badge ${badge}">${badge==='train'?'Training day':badge==='off'?'Off day':'Rest day'}</span><div style="font-size:18px;font-weight:700;margin-bottom:2px">${title}</div><div style="font-size:12px;color:var(--text2);margin-bottom:14px">${sub}</div>${dt!=='rest'&&!SESS.active?'<button class="btn btn-primary" onclick="startSession()">▶ Start session</button>':''}${dt!=='rest'&&SESS.active?'<button class="btn btn-ghost" onclick="switchTab(\'workout\')">Continue session →</button>':''}</div>
    <div class="stats-grid"><div class="stat"><div class="stat-val">${ST.sessions.length}</div><div class="stat-label">Sessions logged</div></div><div class="stat"><div class="stat-val">${calcStreak()}</div><div class="stat-label">Day streak</div></div></div>

}

// ─── WORKOUT ──────────────────────────────────────────────────────────────────
function renderWorkout(){
  const dt=getDT(),av=altV(),rv=rdlV();
  let html='';
  if(dt==='rest'){html='<div class="empty"><div class="empty-icon">😴</div>Rest day — full recovery.</div>';}
  else if(dt==='training'){
    html+=`<div class="autosave-bar"><div class="autosave-dot"></div>${SESS.active?'Progress saves automatically — safe to close and reopen':'Tap Start session on Today tab to enable autosave'}</div>`;
    html+=bsep('Warm up — 10 min');PROG.warmup.forEach((e,i)=>html+=exCard(e,'wu'+i));
    html+=bsep('Block 1 — ATG legs');PROG.b1.forEach((e,i)=>html+=exCard(e,'b1'+i));
    html+=exCard(av==='A'?PROG.sqA:PROG.sqB,'sq0');
    html+=exCard(rv==='single'?PROG.rdlA:PROG.rdlB,'rdl0');

    html+=`<div class="autosave-bar"><div class="autosave-dot"></div>${SESS.active?'Progress saves automatically':'Tap Start session on Today tab'}</div>`;
    html+=bsep('Basketball');PROG.ball.forEach((e,i)=>html+=exCard(e,'ba'+i));
    html+=bsep('Skill work — L-sit');PROG.skill.forEach((e,i)=>html+=exCard(e,'sk'+i));
    html+=bsep('Forearm + calf');PROG.forearm.forEach((e,i)=>html+=exCard(e,'fa'+i));
    html+=exCard(ST.offAltIndex%2===0?PROG.altA:PROG.altB,'alt0');
    html+=`<button class="btn btn-save" onclick="finishSession()">💾 Save and complete session</button>`;
  } else if(dt==='hiit'){
    html+=`<div class="autosave-bar"><div class="autosave-dot"></div>${SESS.active?'Progress saves automatically':'Tap Start session on Today tab'}</div>`;
    html+=bsep('Skill work — L-sit');PROG.skill.forEach((e,i)=>html+=exCard(e,'sk'+i));
    html+=bsep('Forearm + calf');PROG.forearm.forEach((e,i)=>html+=exCard(e,'fa'+i));
    html+=exCard(ST.offAltIndex%2===0?PROG.altA:PROG.altB,'alt0');
    html+=bsep('HIIT');PROG.hiit.forEach((e,i)=>html+=exCard(e,'hi'+i));
    html+=`<button class="btn btn-save" onclick="finishSession()">💾 Save and complete session</button>`;
  } else {
    html+=`<div class="autosave-bar"><div class="autosave-dot"></div>${SESS.active?'Progress saves automatically':'Tap Start session on Today tab'}</div>`;
    html+=bsep('Steady cycling — 10–15 min');PROG.cycling.forEach((e,i)=>html+=exCard(e,'cy'+i));
    html+=bsep('Deep stretch');PROG.stretch.forEach((e,i)=>html+=exCard(e,'st'+i));
    html+=bsep('Skill work — L-sit');PROG.skill.forEach((e,i)=>html+=exCard(e,'sk'+i));
    html+=bsep('Forearm + calf');PROG.forearm.forEach((e,i)=>html+=exCard(e,'fa'+i));
    html+=exCard(ST.offAltIndex%2===0?PROG.altA:PROG.altB,'alt0');
    html+=`<button class="btn btn-save" onclick="finishSession()">💾 Save and complete session</button>`;
  }
  document.getElementById('p-workout').innerHTML=html;
}

  'fa0':'Wrist curls','fa1':'Reverse wrist curls','fa2':'Wrist rotation','fa3':'Brachioradialis raises','fa4':'Farmers hold','fa5':'Calf raises — straight',
  'alt0':'Bent knee calf / Hip flexor KB','hi0':'HIIT — Spin bike','ba0':'Basketball','cy0':'Steady cycling',
  'st0':'Couch stretch','st1':'Tibialis stretch','st2':'Elephant stretch','st3':'90/90 hip stretch','st4':'Calf stretch','st5':'Plantar fascia','st6':'Doorway stretch','st7':'Shoulder dislocates','st8':'Dead hang',
};

let chartRange = 'all';
let chartExId = '';

function getFilteredSessions(range) {
  if(range==='all') return ST.sessions;
  const weeks = range==='4w'?4:range==='8w'?8:16;
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - weeks*7);
  return ST.sessions.filter(s => new Date(s.date) >= cutoff);
}

function renderCharts(){
  // Build exercise list from sessions that have exData
  const exIds = new Set();
  ST.sessions.forEach(s=>{if(s.exData)Object.keys(s.exData).forEach(k=>exIds.add(k));});
  const options = [...exIds].map(id=>`<option value="${id}"${id===chartExId?' selected':''}>${EX_NAMES[id]||id}</option>`).join('');

  document.getElementById('p-charts').innerHTML=`
    <div class="card-title" style="margin-bottom:8px">Progression Charts</div>
    <select class="chart-select" onchange="chartExId=this.value;renderChartContent()" ${!options?'disabled':''}>
      <option value="">${options?'Select an exercise...':'Log sessions to see charts'}</option>
      ${options}
    </select>
    <div class="range-toggle">
      <div class="range-opt${chartRange==='all'?' on':''}" onclick="chartRange='all';setRangeActive(this);renderChartContent()">All time</div>
      <div class="range-opt${chartRange==='16w'?' on':''}" onclick="chartRange='16w';setRangeActive(this);renderChartContent()">16 weeks</div>
      <div class="range-opt${chartRange==='8w'?' on':''}" onclick="chartRange='8w';setRangeActive(this);renderChartContent()">8 weeks</div>
      <div class="range-opt${chartRange==='4w'?' on':''}" onclick="chartRange='4w';setRangeActive(this);renderChartContent()">4 weeks</div>
    </div>
    <div id="chartContent"></div>
    <div id="volChart"></div>
  `;
  renderChartContent();
  renderVolumeChart();
}

function setRangeActive(el){document.querySelectorAll('.range-opt').forEach(o=>o.classList.remove('on'));el.classList.add('on');}

function renderChartContent(){
  const el=document.getElementById('chartContent');
  if(!el)return;
  if(!chartExId){el.innerHTML='<div class="chart-wrap"><div class="chart-empty">Select an exercise above to see progression</div></div>';renderVolumeChart();return;}
  const sessions=getFilteredSessions(chartRange).filter(s=>s.exData&&s.exData[chartExId]&&s.exData[chartExId].sets&&s.exData[chartExId].sets.length);
  if(!sessions.length){el.innerHTML='<div class="chart-wrap"><div class="chart-empty">No data for this exercise in the selected range</div></div>';renderVolumeChart();return;}

  // Extract best set per session for weight and reps
  const dataPoints = sessions.map(s=>{
    const sets = s.exData[chartExId].sets.filter(st=>st.r||st.w);
    const bestW = sets.reduce((best,st)=>parseFloat(st.w||0)>parseFloat(best.w||0)?st:best,sets[0]||{});
    const bestR = sets.reduce((best,st)=>parseInt(st.r||0)>parseInt(best.r||0)?st:best,sets[0]||{});
    return {date:new Date(s.date),w:parseFloat(bestW.w||0),r:parseInt(bestR.r||0),label:new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
  });

  const hasWeight = dataPoints.some(d=>d.w>0);
  const hasReps = dataPoints.some(d=>d.r>0);
  const W=340,H=160,PL=36,PR=12,PT=12,PB=28;
  const chartW=W-PL-PR,chartH=H-PT-PB;
  const n=dataPoints.length;

  function makeLine(vals,color,dotClass,lineClass){
    const min=Math.min(...vals),max=Math.max(...vals);
    const range=max-min||1;
    const pts=vals.map((v,i)=>{
      const x=PL+(n===1?chartW/2:i*chartW/(n-1));
      const y=PT+chartH-(v-min)/range*chartH;
      return{x,y,v};
    });
    const path=pts.map((p,i)=>(i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`)).join(' ');
    const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" class="${dotClass}"><title>${p.v}</title></circle>`).join('');
    const yLabels=[min,max].map(v=>{
      const y=PT+chartH-(v-min)/range*chartH;
      return`<text x="${PL-4}" y="${y+4}" text-anchor="end" class="chart-axis-label">${v}</text>`;
    }).join('');
    return{path,dots,yLabels};
  }

  let svgContent='';
  // X axis labels
  const xLabels=dataPoints.map((d,i)=>{
    const x=PL+(n===1?chartW/2:i*chartW/(n-1));
    return`<text x="${x}" y="${H-4}" text-anchor="middle" class="chart-axis-label">${d.label}</text>`;
  }).join('');
  // Grid lines
  const grid=[0.25,0.5,0.75,1].map(p=>`<line x1="${PL}" y1="${PT+chartH*(1-p)}" x2="${W-PR}" y2="${PT+chartH*(1-p)}" stroke="#2e3248" stroke-width="0.5"/>`).join('');

  if(hasWeight){const wLine=makeLine(dataPoints.map(d=>d.w),'#4f8ef7','chart-dot-weight','chart-line-weight');svgContent+=`<path d="${wLine.path}" class="chart-line-weight"/>${wLine.dots}${wLine.yLabels}`;}
  if(hasReps){const rLine=makeLine(dataPoints.map(d=>d.r),'#3ecf8e','chart-dot-reps','chart-line-reps');svgContent+=`<path d="${rLine.path}" class="chart-line-reps" stroke-dasharray="${hasWeight?'4,3':'none'}"/>${rLine.dots}${!hasWeight?rLine.yLabels:''}`;}

  const legend=(hasWeight?`<div class="chart-legend-item"><div class="chart-legend-dot" style="background:#4f8ef7"></div>Weight (lb)</div>`:'')+(hasReps?`<div class="chart-legend-item"><div class="chart-legend-dot" style="background:#3ecf8e"></div>Reps${hasWeight?' (dashed)':''}</div>`:'');

  el.innerHTML=`<div class="chart-wrap">
    <div class="chart-title">${EX_NAMES[chartExId]||chartExId} — Progression</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">${grid}${xLabels}${svgContent}</svg>
    <div class="chart-legend">${legend}</div>
  </div>`;
  renderVolumeChart();
}

function renderVolumeChart(){
  const el=document.getElementById('volChart');if(!el)return;
  const sessions=getFilteredSessions(chartRange);
  if(!sessions.length){el.innerHTML='';return;}
  const W=340,H=120,PL=28,PR=12,PT=12,PB=24;
  const chartW=W-PL-PR,chartH=H-PT-PB;
  const n=sessions.length;
  const counts=sessions.map(s=>s.exCount||0);
  const max=Math.max(...counts)||1;
  const barW=Math.max(4,Math.floor(chartW/n)-2);
  const bars=sessions.map((s,i)=>{
    const x=PL+i*(chartW/n);
    const h=Math.max(2,(counts[i]/max)*chartH);
    const y=PT+chartH-h;
    const label=new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    return`<rect x="${x+1}" y="${y}" width="${barW}" height="${h}" class="vol-bar" rx="2"><title>${label}: ${counts[i]} exercises</title></rect>`;
  }).join('');
  const xLabels=n<=8?sessions.map((s,i)=>{const x=PL+i*(chartW/n)+barW/2;return`<text x="${x}" y="${H-4}" text-anchor="middle" class="chart-axis-label">${new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`;}).join(''):'';
  el.innerHTML=`<div class="chart-wrap"><div class="chart-title">Session volume — exercises completed</div><svg viewBox="0 0 ${W} ${H}" width="100%">${bars}${xLabels}</svg></div>`;
}

// ─── COACH ────────────────────────────────────────────────────────────────────
function renderCoach(){
  const quicks=['Am I ready to progress this week?','How is my pull up trend?','ACL knee felt off — what to adjust?','When to add weight to hack squats?','How is my overall progress?','What should I focus on next session?'];
  const chatHtml=ST.chat.length?ST.chat.map(m=>`<div class="${m.r==='u'?'msg-user':'msg-coach'}">${m.c}</div>`).join(''):'<div class="msg-coach">Hi — I\'m your Grind coach. I know your full program, your ACL history, your current numbers, and your goals. Ask me anything.</div>';
  document.getElementById('p-coach').innerHTML=`
    ${!ST.apiKey?`<div class="api-box"><div style="font-size:13px;font-weight:700;color:var(--amber);margin-bottom:6px">🔑 Add API key to unlock coach</div><div style="font-size:12px;color:var(--text2);margin-bottom:10px;line-height:1.5">Get a free key at console.anthropic.com. Saves locally — only sent to Anthropic when you ask a question.</div><input type="password" class="api-inp" id="coachKey" placeholder="sk-ant-..."><button class="api-save" onclick="saveKey()">Save and unlock</button></div>`:`<div style="display:flex;align-items:center;margin-bottom:10px"><span style="width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px"></span><span style="font-size:12px;color:var(--text2)">Coach connected</span><button onclick="ST.apiKey='';persist();renderCoach();" style="margin-left:auto;background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer">Change key</button></div>`}
    <div class="quick-wrap">${quicks.map(q=>`<div class="quick-btn" onclick="askQ('${q}')">${q}</div>`).join('')}</div>
    <div class="chat-wrap" id="chatWrap">${chatHtml}</div>
    <div class="chat-inp-row"><textarea class="chat-inp" id="chatInp" placeholder="Ask your coach..."></textarea><button class="chat-send" id="chatSend" onclick="sendMsg()">Send</button></div>`;
  const cw=document.getElementById('chatWrap');if(cw)cw.scrollTop=cw.scrollHeight;
}

function saveKey(){const k=document.getElementById('coachKey')?.value.trim();if(!k)return;ST.apiKey=k;persist();renderCoach();}
function askQ(q){const inp=document.getElementById('chatInp');if(inp){inp.value=q;sendMsg();}}

async function sendMsg(){
  const inp=document.getElementById('chatInp');const msg=inp?.value.trim();if(!msg)return;
  if(!ST.apiKey){alert('Add your API key in Settings first.');return;}
  inp.value='';ST.chat.push({r:'u',c:msg});persist();
  const cw=document.getElementById('chatWrap');if(cw){cw.innerHTML+=`<div class="msg-user">${msg}</div><div class="msg-coach" id="loading" style="color:var(--text2);font-style:italic">Thinking...</div>`;cw.scrollTop=cw.scrollHeight;}
  const btn=document.getElementById('chatSend');if(btn)btn.disabled=true;
  const recent=ST.sessions.slice(-10).map(s=>`${new Date(s.date).toLocaleDateString()} — ${s.type} — ${s.exCount} exercises`).join('\n');
  const sys=`You are a direct personal training coach for someone recovering from ACL reconstruction (3 years post-op, graft fully mature). Goal: lean bulk, strength over size. Fasting 16:8 (5:30pm–9:30am). HIIT at 8am fasted. Supplements: collagen+vit C 7:15am, algae omega-3+D3/K2 at breakfast, magnesium glycinate at night.

PHASE: Weeks 5–8 (July 14–Aug 10, 2026). Training alt: ${ST.trainAltIndex} (${altV()} today). Off day alt: ${ST.offAltIndex} (${offAltV()} today).
TRAINING (Mon/Wed/Fri) — B1: Tibialis raises (standing then seated 15lb), Patrick step 6" platform + isometric knee hold (heel flat throughout), Alt: ATG split squat progressing 18→12" platform ACL leg forward(A)/Hack squat 10lb(B), Alt: Single leg RDL 20lb(A)/Barbell RDL 60-80lb(B). B2 Alt: A=Pull ups FULLY UNASSISTED all sets + TRX rows (superset), B=Pike push ups + Dips. B3: Dead bug 20lb + Copenhagen plank knee on 20" platform + Hyperextensions with isometric cantilever hold variation.
OFF DAYS: Basketball first on Thursday then skill. L-sit: 20sec hold + 10 rep raises each set. Wrist curls 12lb + reverse + wrist rotation 12lb + brachioradialis raises 12lb + farmers hold 53lb each hand (106lb total) + calf raises 2x45lb different angles. Alt: bent knee calf(A)/hip flexor KB on foot(B). Tue=HIIT, Thu=Basketball, Sat=Steady cycling 11min then deep stretch.
BESTS: Pull ups fully unassisted all sets, dips 5 BW, hack squat 10lb, barbell RDL 80lb/8, single leg RDL 20lb, L-sit both legs 20sec + 10 raises, farmers 53lb each/40sec, calf 2x45lb/8.
ACL: ACL leg first always. ATG split squat ACL leg forward on platform with 2 sec pause at bottom. No weight increase if ACL leg lags. Vastus lateralis mild weakness ACL side — reassess week 8.
GOALS: Muscle up, handstand, archer push ups, full L-sit.
SESSIONS:\n${recent||'None yet.'}
Direct, specific, under 200 words. Use actual numbers.`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':ST.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,system:sys,messages:ST.chat.map(m=>({role:m.r==='u'?'user':'assistant',content:m.c}))})});
    const data=await res.json();const reply=data.content?.[0]?.text||'Something went wrong.';ST.chat.push({r:'a',c:reply});persist();
  }catch(e){ST.chat.push({r:'a',c:'Connection error. Check your API key.'});persist();}
  if(btn)btn.disabled=false;renderCoach();
}

// ─── SETTINGS ─────────────────────────────────────────────────────────────────
function renderSettings(){
  document.getElementById('p-settings').innerHTML=`
    <div class="card"><div class="card-title">Storage</div>
      <div class="srow"><div><div class="slbl">localStorage</div><div class="ssub">Permanent on Safari home screen</div></div><span class="status-on">✓ Active</span></div>
      <div class="srow" style="border:none"><div><div class="slbl">Autosave</div><div class="ssub">Every action saves instantly</div></div><span class="status-on">✓ On</span></div>
    </div>
    <div class="card"><div class="card-title">Phase</div>
      <div class="phase-toggle">${PHASES.map((p,i)=>`<div class="phase-opt${ST.phase===i?' on':''}" onclick="setPhase(${i})">${p.label}</div>`).join('')}</div>
      <div style="font-size:12px;color:var(--text3)">Current: ${PHASES[ST.phase]?.name} phase. Future phases load automatically when selected.</div>
    </div>
    <div class="card"><div class="card-title">API key</div>
      <input type="password" class="api-inp" id="settKey" placeholder="sk-ant-..." value="${ST.apiKey||''}">
      <button class="api-save" onclick="saveApiSett()">Save key</button>
    </div>
    <div class="card"><div class="card-title">Stats</div>
      <div class="srow"><div class="slbl">Sessions logged</div><span class="sval">${ST.sessions.length}</span></div>
      <div class="srow"><div class="slbl">Current streak</div><span class="sval">${calcStreak()} days</span></div>
      <div class="srow"><div class="slbl">Training alt index</div><span class="sval">${ST.trainAltIndex} (${altV()} today)</span></div>
      <div class="srow" style="border:none"><div class="slbl">Off day alt index</div><span class="sval">${ST.offAltIndex} (${offAltV()} today)</span></div>
    </div>
    <div class="card"><div class="card-title">Export and import</div>
      <div style="font-size:12px;color:var(--text2);margin-bottom:10px">Export weekly as backup. Data never leaves your phone.</div>
      <div class="export-grid">
        <button class="export-btn" onclick="exportJSON()">📤 Export JSON<br><span style="font-size:10px;color:var(--text3)">Raw data file</span></button>
        <button class="export-btn" onclick="exportReport()">📄 Export report<br><span style="font-size:10px;color:var(--text3)">Readable text</span></button>
        <button class="export-btn" onclick="copyData()">📋 Copy data<br><span style="font-size:10px;color:var(--text3)">To clipboard</span></button>
        <button class="export-btn" onclick="triggerImport()">📥 Import JSON<br><span style="font-size:10px;color:var(--text3)">Restore backup</span></button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
    </div>
    <button class="btn btn-danger" onclick="clearData()">🗑 Clear all session data</button>`;
}

function setPhase(i){ST.phase=i;persist();renderSettings();}
function saveApiSett(){const k=document.getElementById('settKey')?.value.trim();if(!k)return;ST.apiKey=k;persist();alert('API key saved.');}
function exportJSON(){const a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify({state:ST,session:SESS},null,2));a.download='grind_'+new Date().toISOString().split('T')[0]+'.json';a.click();}
function exportReport(){const lines=['Grind — Session Report','Generated: '+new Date().toLocaleString(),'','Sessions: '+ST.sessions.length,'Phase: '+PHASES[ST.phase]?.label,'','=== HISTORY ==='];ST.sessions.forEach(s=>lines.push(new Date(s.date).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+' — '+s.type+' — '+s.exCount+' exercises'));const a=document.createElement('a');a.href='data:text/plain;charset=utf-8,'+encodeURIComponent(lines.join('\n'));a.download='grind_report_'+new Date().toISOString().split('T')[0]+'.txt';a.click();}
function copyData(){navigator.clipboard?.writeText(JSON.stringify({state:ST,session:SESS},null,2)).then(()=>alert('Copied to clipboard.')).catch(()=>alert('Use Export JSON instead.'));}
function triggerImport(){document.getElementById('importFile')?.click();}
function importData(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=function(e){
    try{
      const d=JSON.parse(e.target.result);
      if(d.state){ST={...ST,...d.state};}
      if(d.session?.active){SESS={...SESS,...d.session};}
      persist();renderSettings();renderDash();
      alert('Data imported. '+( ST.sessions.length)+' sessions restored.');
    }catch(err){alert('Import failed. Select a valid Grind JSON file.');}
  };
  r.readAsText(file);
}
function clearData(){if(!confirm('Clear all session data? API key and settings are kept.'))return;ST.sessions=[];ST.chat=[];ST.trainAltIndex=0;ST.offAltIndex=0;SESS={active:false,exDone:{},setData:{},startTime:null};extraSets={};persist();renderSettings();renderDash();alert('Cleared.');}

// ─── INIT ─────────────────────────────────────────────────────────────────────
loadData();
renderDash();
</script>
