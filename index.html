<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grind">
<meta name="theme-color" content="#0f1117">
<title>Grind</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0f1117;--surf:#1a1d27;--surf2:#222638;--border:#2e3248;--accent:#4f8ef7;--accent2:#7c5cbf;--green:#3ecf8e;--amber:#f5a623;--red:#e05252;--text:#e8eaf0;--text2:#8b90a7;--text3:#555a73;--r:12px;--r2:8px}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;font-size:14px;overflow-x:hidden}
input[type=number]{-webkit-appearance:none;-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea,input,select{font-family:inherit}
::-webkit-scrollbar{width:0}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.nav{display:flex;background:var(--surf);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;overflow-x:auto}
.nt{flex:1;min-width:52px;padding:8px 2px 6px;text-align:center;font-size:8.5px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;letter-spacing:.2px;text-transform:uppercase}
.nt.on{color:var(--accent);border-bottom-color:var(--accent)}
.nt .ico{font-size:15px;display:block;margin-bottom:2px}
.page{display:none;padding:12px;padding-bottom:90px;flex:1}
.page.on{display:block}
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-bottom:6px}
.badge.train{background:rgba(79,142,247,.15);color:var(--accent)}
.badge.off{background:rgba(124,92,191,.15);color:var(--accent2)}
.badge.rest{background:rgba(85,90,115,.3);color:var(--text2)}
.alt-a{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(79,142,247,.15);color:var(--accent)}
.alt-b{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(124,92,191,.15);color:var(--accent2)}
.alt-c{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(62,207,142,.15);color:var(--green)}
.acl-b{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(62,207,142,.15);color:var(--green)}
.new-b{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px;background:rgba(245,166,35,.15);color:var(--amber)}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat{background:var(--surf2);border-radius:var(--r2);padding:12px}
.stat-val{font-size:22px;font-weight:800;color:var(--accent)}
.stat-label{font-size:11px;color:var(--text2);margin-top:1px}
.btn{width:100%;border:none;border-radius:var(--r2);padding:12px;font-size:14px;font-weight:700;cursor:pointer;display:block;text-align:center}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:active{opacity:.85}
.btn-resume{background:var(--accent2);color:#fff}
.btn-discard{background:transparent;border:1px solid var(--text3);color:var(--text2);font-size:12px;padding:9px}
.btn-save{background:var(--accent);color:#fff;font-size:15px;padding:14px;margin-top:20px}
.btn-green{background:var(--green);color:#fff;padding:10px;font-size:13px;margin-top:10px}
.btn-danger{background:transparent;border:1px solid var(--red);color:var(--red);margin-top:16px}
.btn-ghost{background:var(--surf2);border:1px solid var(--border);color:var(--text2);padding:10px}
.ex-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px}
.ex-row:last-child{border:none}
.ex-dot{width:6px;height:6px;border-radius:50%;background:var(--border);flex-shrink:0}
.ex-dot.done{background:var(--green)}
.blk-tag{font-size:10px;color:var(--text3);margin-left:auto;white-space:nowrap}
.bsep{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.bsep-lbl{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);white-space:nowrap}
.bsep-line{flex:1;height:1px;background:var(--border)}
.ex-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.ex-card.open{border-color:var(--accent)}
.ex-card.done{border-color:var(--green);opacity:.75}
.ex-head{display:flex;align-items:center;padding:12px 14px;cursor:pointer;gap:10px}
.ex-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ex-card.done .ex-check{background:var(--green);border-color:var(--green)}
.ex-name{flex:1;font-size:13px;font-weight:600}
.ex-meta{font-size:11px;color:var(--text2)}
.ex-chev{color:var(--text3);font-size:16px;transition:transform .15s;display:inline-block}
.ex-card.open .ex-chev{transform:rotate(180deg)}
.ex-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border)}
.ex-card.open .ex-body{display:block}
.note-box{font-size:12px;color:var(--amber);background:rgba(245,166,35,.08);border-radius:var(--r2);padding:8px 10px;margin:10px 0;line-height:1.5}
.acl-box{font-size:12px;color:var(--accent);background:rgba(79,142,247,.08);border-radius:var(--r2);padding:8px 10px;margin:8px 0}
.superset-box{font-size:12px;color:var(--accent2);background:rgba(124,92,191,.08);border-radius:var(--r2);padding:8px 10px;margin:8px 0}
.prev-sessions{margin:10px 0;border:1px solid var(--border);border-radius:var(--r2);overflow:hidden}
.prev-header{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);padding:6px 10px;background:var(--surf2);border-bottom:1px solid var(--border)}
.prev-item{padding:8px 10px;border-bottom:1px solid var(--border)}
.prev-item:last-child{border:none}
.prev-date{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:2px}
.prev-stat{font-size:12px;color:var(--text)}
.prev-comment{font-size:11px;color:var(--accent);font-style:italic;margin-top:2px}
.sets-hdr{display:grid;grid-template-columns:26px 1fr 1fr 50px 26px;gap:5px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;margin-bottom:6px}
.set-row{display:grid;grid-template-columns:26px 1fr 1fr 50px 26px;gap:5px;margin-bottom:6px;align-items:center}
.set-num{font-size:12px;color:var(--text2);text-align:center}
.set-inp{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:7px 4px;color:var(--text);font-size:13px;font-weight:600;width:100%;text-align:center}
.set-inp:focus{outline:none;border-color:var(--accent)}
.set-btn{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:7px 2px;color:var(--text2);font-size:10px;font-weight:600;cursor:pointer;width:100%;text-align:center}
.set-btn.done{background:rgba(62,207,142,.15);border-color:var(--green);color:var(--green)}
.set-del{background:rgba(224,82,82,.1);border:1px solid var(--red);border-radius:var(--r2);color:var(--red);font-size:14px;font-weight:700;cursor:pointer;width:100%;padding:6px 0;line-height:1}
.add-set-btn{width:100%;background:transparent;border:1px dashed var(--border);border-radius:var(--r2);padding:8px;color:var(--text3);font-size:12px;cursor:pointer;margin-top:2px}
.timer-row{background:var(--surf2);border-radius:var(--r2);padding:10px 12px;margin-top:10px;display:flex;align-items:center;gap:10px}
.timer-disp{font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;min-width:44px}
.timer-lbl{font-size:11px;color:var(--text2)}
.timer-btn{margin-left:auto;background:var(--accent);border:none;border-radius:var(--r2);padding:7px 12px;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.timer-btn.stop{background:var(--red)}
.comment-wrap{margin-top:12px}
.comment-lbl{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.comment-inp{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:9px 10px;color:var(--text);font-size:13px;resize:none;min-height:60px;line-height:1.5}
.comment-inp:focus{outline:none;border-color:var(--accent)}
.session-note-card{background:var(--surf);border:1px solid var(--accent2);border-radius:var(--r);padding:14px;margin-bottom:14px}
.session-note-lbl{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--accent2);margin-bottom:8px}
.session-note-inp{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:10px;color:var(--text);font-size:13px;resize:none;min-height:60px;line-height:1.5}
.session-note-inp:focus{outline:none;border-color:var(--accent2)}
.resume-banner{background:rgba(124,92,191,.12);border:1px solid var(--accent2);border-radius:var(--r);padding:14px;margin-bottom:10px}
.resume-actions{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.hist-item{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer}
.hist-item:active{border-color:var(--accent)}
.hist-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.hist-date{font-size:13px;font-weight:700}
.hist-type{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.hist-sum{font-size:12px;color:var(--text2)}
.hist-comment{font-size:11px;color:var(--accent);font-style:italic;margin-top:4px;background:var(--surf2);border-radius:var(--r2);padding:5px 8px;border-left:2px solid var(--accent)}
.hist-note{font-size:11px;color:var(--accent2);font-style:italic;margin-top:4px;background:var(--surf2);border-radius:var(--r2);padding:5px 8px;border-left:2px solid var(--accent2)}
.hist-edit-hint{font-size:10px;color:var(--text3);margin-top:6px;text-align:right}
.edit-banner{background:rgba(79,142,247,.12);border:1px solid var(--accent);border-radius:var(--r);padding:14px;margin-bottom:14px}
.gate-banner{background:rgba(245,166,35,.1);border:1px solid var(--amber);border-radius:var(--r);padding:14px;margin-bottom:14px}
.api-box{background:rgba(245,166,35,.08);border:1px solid var(--amber);border-radius:var(--r);padding:14px;margin-bottom:14px}
.api-inp{width:100%;background:var(--surf);border:1px solid var(--border);border-radius:var(--r2);padding:10px;color:var(--text);font-size:12px;font-family:monospace;margin-bottom:8px}
.api-inp:focus{outline:none;border-color:var(--accent)}
.api-save{width:100%;background:var(--accent);border:none;border-radius:var(--r2);padding:10px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.quick-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.quick-btn{background:var(--surf2);border:1px solid var(--border);border-radius:20px;padding:6px 10px;font-size:11px;color:var(--text2);cursor:pointer}
.chat-wrap{display:flex;flex-direction:column;min-height:180px;max-height:360px;overflow-y:auto;margin-bottom:10px}
.msg-user{max-width:86%;background:var(--accent);color:#fff;border-radius:12px 12px 3px 12px;padding:10px 12px;font-size:13px;line-height:1.6;margin-left:auto;margin-bottom:8px;word-break:break-word}
.msg-coach{max-width:86%;background:var(--surf2);color:var(--text);border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:13px;line-height:1.6;margin-bottom:8px;word-break:break-word}
.chat-inp-row{display:flex;gap:8px}
.chat-inp{flex:1;background:var(--surf);border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;color:var(--text);font-size:13px;resize:none;height:42px}
.chat-inp:focus{outline:none;border-color:var(--accent)}
.chat-send{background:var(--accent);border:none;border-radius:var(--r2);padding:10px 14px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.chat-send:disabled{opacity:.4}
.srow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.srow:last-child{border:none}
.slbl{font-size:14px;font-weight:600}
.ssub{font-size:11px;color:var(--text2);margin-top:1px}
.sval{font-size:12px;color:var(--text2);font-weight:600}
.status-on{color:var(--green);font-size:12px;font-weight:700}
.status-warn{color:var(--amber);font-size:12px;font-weight:700}
.phase-toggle{display:flex;background:var(--surf2);border-radius:var(--r2);padding:3px;margin-bottom:12px;border:1px solid var(--border)}
.phase-opt{flex:1;padding:7px 2px;text-align:center;font-size:9px;font-weight:700;color:var(--text2);border-radius:6px;cursor:pointer;letter-spacing:.3px}
.phase-opt.on{background:var(--accent);color:#fff}
.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.export-btn{background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:10px 8px;font-size:11px;color:var(--text2);cursor:pointer;text-align:center;line-height:1.6}
.autosave-bar{font-size:11px;color:var(--green);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.autosave-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.empty{text-align:center;padding:50px 20px;color:var(--text2)}
.empty-icon{font-size:36px;margin-bottom:10px}
.chart-select{width:100%;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r2);padding:10px 12px;color:var(--text);font-size:14px;margin-bottom:12px;appearance:none;-webkit-appearance:none}
.chart-select:focus{outline:none;border-color:var(--accent)}
.range-toggle{display:flex;background:var(--surf2);border-radius:var(--r2);padding:3px;margin-bottom:14px;border:1px solid var(--border)}
.range-opt{flex:1;padding:6px 2px;text-align:center;font-size:10px;font-weight:700;color:var(--text2);border-radius:6px;cursor:pointer}
.range-opt.on{background:var(--accent);color:#fff}
.chart-wrap{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;overflow:hidden}
.chart-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.chart-empty{text-align:center;padding:30px;color:var(--text3);font-size:13px}
.chart-axis-label{font-size:9px;fill:#8b90a7}
.vol-bar{fill:rgba(79,142,247,.6)}
.stretch-item{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px}
.stretch-name{font-size:14px;font-weight:600;margin-bottom:4px}
.stretch-meta{font-size:12px;color:var(--accent);margin-bottom:6px;font-weight:600}
.stretch-note{font-size:12px;color:var(--text2);line-height:1.5}
</style>
</head>
<body>
<div id="app">
<nav class="nav">
  <div class="nt on" data-tab="dash" onclick="switchTab('dash')"><span class="ico">⊞</span>Today</div>
  <div class="nt" data-tab="workout" onclick="switchTab('workout')"><span class="ico">🏋</span>Workout</div>
  <div class="nt" data-tab="stretch" onclick="switchTab('stretch')"><span class="ico">🧘</span>Stretch</div>
  <div class="nt" data-tab="history" onclick="switchTab('history')"><span class="ico">📋</span>History</div>
  <div class="nt" data-tab="charts" onclick="switchTab('charts')"><span class="ico">📈</span>Charts</div>
  <div class="nt" data-tab="coach" onclick="switchTab('coach')"><span class="ico">🧠</span>Coach</div>
  <div class="nt" data-tab="settings" onclick="switchTab('settings')"><span class="ico">⚙</span>Settings</div>
</nav>
<div class="page on" id="p-dash"></div>
<div class="page" id="p-workout"></div>
<div class="page" id="p-stretch"></div>
<div class="page" id="p-history"></div>
<div class="page" id="p-charts"></div>
<div class="page" id="p-coach"></div>
<div class="page" id="p-settings"></div>
</div>

<script>
const SK='grind_v7';
const SEK='grind_sess_v7';
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const PHASES=[{label:'Weeks 1–4',name:'Foundation'},{label:'Weeks 5–8',name:'Strength'},{label:'Weeks 9–12',name:'Power'},{label:'Phase 3',name:'Skill + Plyo'}];

const PROG={
  warmup:[
    {n:'Leg swings — front and side',m:'10 each leg',note:'Hold wall for balance. Full range of motion.'},
    {n:'Hip circles',m:'10 each direction',note:'Slow and deliberate.'},
    {n:'Cat camels',m:'10 reps',note:'Full spinal flexion and extension.'},
    {n:'Squat sky reaches',m:'10 reps',note:'Deep squat, arms reaching overhead.'},
    {n:'Wrist prep',m:'30 seconds',note:'Circles and floor stretches.'},
    {n:'Dead bug',m:'30 seconds',note:'Core activation. Flatten back completely.'},
  ],
  b1:[
    {n:'Tibialis raises — standing',m:'1×15–20 reps',s:1,r:18,w:0,note:'Activation set. Standing wall version. Toes up.'},
    {n:'Tibialis raises — seated weighted',m:'2×10–12 reps',s:2,r:10,w:15,note:'Leg straight extended. 15lb on foot or shin.'},
  ],
  patrick:{n:'Patrick step — elevated platform',m:'3×6–8 each leg',s:3,r:6,w:0,acl:true,note:'8 inch platform. Post-break: proceed cautiously first 1-2 sessions, watch for shaking/fatigue signal, do this early while fresh. 3 sets stays permanent long-term — this is tendon-conditioning work, not pure strength volume.'},
  isoHold:{n:'Isometric knee forward hold',m:'3 holds × 5 sec each leg',s:3,r:5,w:0,acl:true,note:'Max effort 5-sec push. Not counted as full training volume — tendon conditioning, not hypertrophy work.'},
  sqA:{n:'ATG split squat',m:'3×8 each leg',s:3,r:8,w:0,acl:true,alt:'A',id:'sq_atg',note:'ACL leg forward on platform. 3 sets stays permanent (rehab/tendon role). Post-break: proceed cautiously, watch for fatigue signal first 1-2 sessions.'},
  sqB:{n:'Hack squat (Hackenschmidt)',m:'2×6–8 reps',s:2,r:6,w:35,alt:'B',id:'sq_hack',note:'2 sets now (down from 3) — primary bilateral strength lift, fewer higher-intent sets. KB behind legs, 4 sec down, 1 hold, drive up. Cue outer quad on ACL leg.'},
  sqC:{n:'Goblet squat — front loaded, heels elevated',m:'2×8–10 reps',s:2,r:8,w:0,alt:'C',id:'sq_goblet',note:'NEW — Day C. Kettlebell held at chest, heels on a barbell plate. Front-loading + heel elevation = more upright torso, different angle than Hack squat. 2 sets — bilateral strength lift, same category as Hack squat.'},
  rdlA:{n:'Single leg RDL',m:'2×8 each leg',s:2,r:8,w:35,acl:true,alt:'A',id:'rdl_single',note:'2 sets now (down from 3). ACL leg planted first. Do not add weight if ACL leg lags.'},
  rdlB:{n:'Barbell RDL',m:'2×8 reps',s:2,r:8,w:80,alt:'B',id:'rdl_barbell',note:'2 sets now (down from 3). Bilateral. 3 sec down. Never round lower back.'},
  nordic:{n:'Nordic curl',m:'2–3×3–6 reps',s:3,r:4,w:0,alt:'C',id:'nordic_curl',note:'NEW — Day C, replaces RDL that day only (RDL stays 2x/week on Days A and B). Assisted or partial-range only to start (band-assisted, or stop at 30-45°). Closes the knee-flexion hamstring gap RDL cannot train. Progress range gradually, same deliberate approach as Patrick step depth.'},
  b2A:[
    {n:'Pull ups',m:'3–4 sets to 15 total reps',s:4,r:5,w:0,superset:true,note:'SUPERSET with TRX rows. Fully unassisted. Working toward even set distribution — try longer rest (2–2.5 min) between sets.'},
    {n:'TRX rows',m:'3×8–10 reps',s:3,r:8,w:0,superset:true,note:'SUPERSET with pull ups — immediately after pull ups each round.'},
  ],
  b2B:[
    {n:'Pike push ups',m:'3×5–8 reps',s:3,r:6,w:0,note:'Hips high, head toward floor. Handstand foundation base.'},
    {n:'Dips — progressive',m:'3 sets',s:3,r:8,w:0,note:'Progressing toward weighted.'},
  ],
  b3:[
    {n:'Dead bug with weight',m:'3×10 reps',s:3,r:10,w:20,note:'Both legs extended. Lower back FLAT throughout.'},
    {n:'Copenhagen plank — full extension, bottom leg lifted bent',m:'3×20+ sec each side',s:3,r:23,w:0,acl:true,note:'Foot on bench, bottom leg lifted in bent running position. Build duration toward 40-45 sec.'},
    {n:'Hyperextensions',m:'3×8–10 reps',s:3,r:8,w:25,note:'2 sec up, 1 hold, 2 sec down. Squeeze glutes at top.'},

let ST={apiKey:'',trainAltIndex:0,offAltIndex:0,sessions:[],chat:[],phase:3};
let SESS={active:false,exDone:{},setData:{},startTime:null,dayType:null,dayVariant:null,sessionNote:''};
let timers={};
let extraSets={};
let removedSets={};
let editingIndex=null;

function computeDT(d){const w=(d||new Date()).getDay();if(w===0)return'rest';if(w===1||w===3||w===5)return'training';if(w===2)return'hiit';if(w===4)return'ball';return'stretch';}
function getDT(){return SESS.active&&SESS.dayType?SESS.dayType:computeDT();}
function trainVariant(){
  // A/B/C rotation based on trainAltIndex mod 3
  const r = ST.trainAltIndex % 3;
  return r===0?'A':r===1?'B':'C';
}
function offAltV(){return ST.offAltIndex%2===0?'A':'B';}

function persist(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){}try{localStorage.setItem(SEK,JSON.stringify(SESS));}catch(e){}}
function loadData(){try{const s=localStorage.getItem(SK);if(s)ST={...ST,...JSON.parse(s)};}catch(e){}try{const s=localStorage.getItem(SEK);if(s){const d=JSON.parse(s);if(d.active)SESS={...SESS,...d};}}catch(e){}}

function getLastTwoForExercise(exId){
  const results=[];
  for(let i=ST.sessions.length-1;i>=0&&results.length<2;i--){
    if(editingIndex!==null&&i===editingIndex)continue;
    const sess=ST.sessions[i];
    if(sess.exData&&sess.exData[exId]){results.push({date:sess.date,type:sess.type,data:sess.exData[exId],comment:sess.comments?.[exId]||''});}
  }
  return results;
}

function prevSessionsHtml(exId){
  const prev=getLastTwoForExercise(exId);if(!prev.length)return'';
  const items=prev.map(p=>{
    const d=new Date(p.date).toLocaleDateString('en-US',{month:'short',day:'numeric'});
    const bestSet=p.data.sets&&p.data.sets.length?p.data.sets.reduce((best,s)=>{const w=parseFloat(s.w)||0;const r=parseInt(s.r)||0;return(w>(parseFloat(best.w)||0)||(w===(parseFloat(best.w)||0)&&r>(parseInt(best.r)||0)))?s:best;},p.data.sets[0]||{}):null;
    const statStr=bestSet?`Best set: ${bestSet.r||'—'} reps${bestSet.w?` @ ${bestSet.w}lb`:''}`:'';
    return`<div class="prev-item"><div class="prev-date">${d} — ${p.type.split('—')[0].trim()}</div>${statStr?`<div class="prev-stat">${statStr}</div>`:''}${p.comment?`<div class="prev-comment">📝 ${p.comment}</div>`:''}</div>`;
  }).join('');
  return`<div class="prev-sessions"><div class="prev-header">Last ${prev.length} session${prev.length>1?'s':''}</div>${items}</div>`;
}

function switchTab(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nt').forEach(t=>t.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  document.querySelector(`[data-tab="${id}"]`).classList.add('on');
  if(id==='dash')renderDash();
  if(id==='workout')renderWorkout();
  if(id==='stretch')renderStretch();
  if(id==='history')renderHistory();
  if(id==='charts')renderCharts();
  if(id==='coach')renderCoach();
  if(id==='settings')renderSettings();
}

function fmtTime(id){const s=timers[id]?.secs!==undefined?timers[id].secs:90;if(s<=0)return'Go!';return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');}
function calcStreak(){if(!ST.sessions.length)return 0;let streak=0;const t=new Date();t.setHours(0,0,0,0);let c=new Date(t);for(let i=ST.sessions.length-1;i>=0;i--){const d=new Date(ST.sessions[i].date);d.setHours(0,0,0,0);if(d.getTime()===c.getTime()){streak++;c.setDate(c.getDate()-1);}else if(d.getTime()<c.getTime())break;}return streak;}
function bsep(label){return`<div class="bsep"><div class="bsep-lbl">${label}</div><div class="bsep-line"></div></div>`;}
function altBadge(a){const cls=a==='A'?'alt-a':a==='B'?'alt-b':'alt-c';return`<span class="${cls}">${a}</span>`;}

function saveComment(id,val){SESS.setData[`${id}-comment`]=val;persist();const el=document.getElementById(`cs-${id}`);if(el){el.style.display='block';setTimeout(()=>{el.style.display='none';},1200);}}
function saveSessionNote(val){SESS.sessionNote=val;persist();const el=document.getElementById('sessionNoteSaved');if(el){el.style.display='block';setTimeout(()=>{el.style.display='none';},1200);}}

function getActiveSetIndices(id,defaultCount){
  const removed=removedSets[id]||[];
  const extra=extraSets[id]||0;
  const total=defaultCount+extra;
  const indices=[];
  for(let i=0;i<total;i++){if(!removed.includes(i))indices.push(i);}
  return indices;
}

function exCard(ex,id){
  const isDone=!!SESS.exDone[id];
  const hasSets=ex.s&&ex.s>0;
  const comment=SESS.setData[`${id}-comment`]||'';
  const prev=prevSessionsHtml(id);
  const activeIndices=hasSets?getActiveSetIndices(id,ex.s):[];

  let setsHtml='';
  if(hasSets){
    setsHtml+=`<div class="sets-hdr"><div>Set</div><div>Reps</div><div>Wt</div><div>Done</div><div></div></div>`;
    activeIndices.forEach((i,displayIdx)=>{
      const done=!!SESS.setData[`${id}-${i}-done`];
      const reps=SESS.setData[`${id}-${i}-reps`]||'';
      const wt=SESS.setData[`${id}-${i}-wt`]||'';
      setsHtml+=`<div class="set-row"><div class="set-num">${displayIdx+1}</div><input class="set-inp" type="number" inputmode="numeric" placeholder="${ex.r||'—'}" value="${reps}" onchange="setVal('${id}',${i},'reps',this.value)"><input class="set-inp" type="number" inputmode="decimal" placeholder="${ex.w!==undefined?ex.w:'—'}" value="${wt}" onchange="setVal('${id}',${i},'wt',this.value)"><button class="set-btn${done?' done':''}" onclick="toggleSetDone('${id}',${i})">${done?'✓':'Done'}</button><button class="set-del" onclick="removeSet('${id}',${i})" title="Remove set">×</button></div>`;
    });
    setsHtml+=`<button class="add-set-btn" onclick="addSet('${id}')">+ Add set</button>`;
    setsHtml+=`<div class="timer-row"><div><div class="timer-disp" id="td-${id}">${fmtTime(id)}</div><div class="timer-lbl">Rest timer</div></div><button class="timer-btn${timers[id]?.running?' stop':''}" id="tb-${id}" onclick="toggleTimer('${id}')">${timers[id]?.running?'Stop':timers[id]?.secs===0?'Reset':'Start'}</button></div>`;
  }

  return`<div class="ex-card${isDone?' done':''}" id="ec-${id}">
    <div class="ex-head" onclick="toggleEx('${id}')">
      <div class="ex-check">${isDone?'<span style="color:#fff;font-size:11px">✓</span>':''}</div>
      <div style="flex:1"><div class="ex-name">${ex.n}${ex.alt?altBadge(ex.alt):''}${ex.superset?'<span style="font-size:9px;color:#7c5cbf;margin-left:4px;font-weight:700">SUPER</span>':''}</div><div class="ex-meta">${ex.m}${comment?'<span style="color:var(--accent);font-size:10px;margin-left:4px">📝</span>':''}</div></div>
      <span class="ex-chev">⌄</span>
    </div>
    <div class="ex-body">
      ${prev}
      ${ex.note?`<div class="note-box">📋 ${ex.note}</div>`:''}
      ${ex.acl?'<div class="acl-box">⚡ ACL leg always goes first — every set, no exceptions.</div>':''}
      ${ex.superset?'<div class="superset-box">🔗 Superset — do this then immediately the paired exercise, then rest 90 sec.</div>':''}
      ${setsHtml}
      <div class="comment-wrap"><div class="comment-lbl">📝 Session note</div><textarea class="comment-inp" placeholder="e.g. felt good, no fatigue signal..." oninput="saveComment('${id}',this.value)">${comment}</textarea><div class="comment-saved" id="cs-${id}" style="font-size:11px;color:var(--green);margin-top:4px;display:none">✓ Saved</div></div>
      <button class="btn btn-green" onclick="markDone('${id}')">✓ Mark complete</button>
    </div>
  </div>`;
}

function toggleEx(id){const card=document.getElementById('ec-'+id);if(!card)return;const isOpen=card.classList.contains('open');document.querySelectorAll('.ex-card.open').forEach(c=>c.classList.remove('open'));if(!isOpen){card.classList.add('open');card.scrollIntoView({behavior:'smooth',block:'nearest'});}}
function setVal(id,idx,field,val){SESS.setData[`${id}-${idx}-${field}`]=val;persist();}
function toggleSetDone(id,idx){const key=`${id}-${idx}-done`;SESS.setData[key]=!SESS.setData[key];persist();renderWorkout();setTimeout(()=>{const c=document.getElementById('ec-'+id);if(c)c.classList.add('open');},50);}
function addSet(id){extraSets[id]=(extraSets[id]||0)+1;renderWorkout();setTimeout(()=>{const c=document.getElementById('ec-'+id);if(c)c.classList.add('open');},50);}
function removeSet(id,idx){if(!removedSets[id])removedSets[id]=[];removedSets[id].push(idx);delete SESS.setData[`${id}-${idx}-reps`];delete SESS.setData[`${id}-${idx}-wt`];delete SESS.setData[`${id}-${idx}-done`];persist();renderWorkout();setTimeout(()=>{const c=document.getElementById('ec-'+id);if(c)c.classList.add('open');},50);}
function markDone(id){SESS.exDone[id]=true;persist();const card=document.getElementById('ec-'+id);if(card){card.classList.add('done');card.classList.remove('open');const ck=card.querySelector('.ex-check');if(ck)ck.innerHTML='<span style="color:#fff;font-size:11px">✓</span>';}const dot=document.querySelector(`[data-ex="${id}"]`);if(dot)dot.classList.add('done');}

function toggleTimer(id){
  if(timers[id]?.running){clearInterval(timers[id].iv);timers[id]={running:false,secs:90};const btn=document.getElementById('tb-'+id);const disp=document.getElementById('td-'+id);if(btn){btn.textContent='Start';btn.classList.remove('stop');}if(disp)disp.textContent='1:30';return;}
  let s=90;timers[id]={running:true,secs:90};const btn=document.getElementById('tb-'+id);if(btn){btn.textContent='Stop';btn.classList.add('stop');}
  timers[id].iv=setInterval(()=>{s--;timers[id].secs=s;const disp=document.getElementById('td-'+id);if(disp)disp.textContent=s<=0?'Go!':Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');if(s<=0){clearInterval(timers[id].iv);timers[id].running=false;const b=document.getElementById('tb-'+id);if(b){b.textContent='Reset';b.classList.remove('stop');}}},1000);
}

function startSession(){const dt=computeDT();const dv=dt==='training'?trainVariant():null;SESS={active:true,exDone:{},setData:{},startTime:new Date().toISOString(),dayType:dt,dayVariant:dv,sessionNote:''};extraSets={};removedSets={};editingIndex=null;persist();switchTab('workout');}

function discardSession(){
  if(!confirm('Discard this unfinished session? All logged data for it will be lost.'))return;
  SESS={active:false,exDone:{},setData:{},startTime:null,dayType:null,dayVariant:null,sessionNote:''};
  extraSets={};removedSets={};editingIndex=null;persist();renderDash();
}

function editSession(idx){
  const s=ST.sessions[idx];
  if(!s)return;
  const exDone={};
  Object.keys(s.exData||{}).forEach(k=>{if(s.exData[k].done)exDone[k]=true;});
  const setData={};
  Object.keys(s.exData||{}).forEach(k=>{
    const sets=s.exData[k].sets||[];
    sets.forEach((st,i)=>{
      if(st.r)setData[`${k}-${i}-reps`]=st.r;
      if(st.w)setData[`${k}-${i}-wt`]=st.w;
      if(st.done)setData[`${k}-${i}-done`]=true;
    });
  });
  Object.keys(s.comments||{}).forEach(k=>{setData[`${k}-comment`]=s.comments[k];});
  extraSets={};removedSets={};
  SESS={active:true,exDone,setData,startTime:s.startTime||s.date,dayType:s.dayType||dtFromType(s.type),dayVariant:s.dayVariant||null,sessionNote:s.sessionNote||''};
  editingIndex=idx;
  persist();
  switchTab('workout');
}

function dtFromType(type){
  if(type.startsWith('Training'))return'training';
  if(type==='HIIT + Skill')return'hiit';
  if(type==='Basketball + Skill')return'ball';
  if(type==='Stretch + Skill'||type.includes('Plyo'))return'stretch';
  return'training';
}

function cancelEdit(){
  if(!confirm('Discard changes to this session? Nothing will be saved.'))return;
  SESS={active:false,exDone:{},setData:{},startTime:null,dayType:null,dayVariant:null,sessionNote:''};
  extraSets={};removedSets={};editingIndex=null;persist();switchTab('history');
}

function collectExData(){
  const exData={};
  const allExIds=['wu0','wu1','wu2','wu3','wu4','wu5','b10','b11','patrick','isoHold','sq_atg','sq_hack','sq_goblet','rdl_single','rdl_barbell','nordic_curl','b20','b21','b30','b31','b32','b33','lsit','handstand','fa0','fa1','fa2','fa3','fa4','cf0','cf1','cf2','cf3','cf4','cfTrim0','alt_calf','alt_hipflexor','gl0','ad0','py0','py1','py2','py3','hi0','ba0'];
  allExIds.forEach(id=>{
    const sets=[];
    for(let i=0;i<25;i++){const reps=SESS.setData[`${id}-${i}-reps`];const wt=SESS.setData[`${id}-${i}-wt`];const done=SESS.setData[`${id}-${i}-done`];if(reps||wt||done)sets.push({r:reps||'',w:wt||'',done:!!done});}
    if(sets.length||SESS.exDone[id])exData[id]={sets,done:!!SESS.exDone[id]};
  });
  return exData;
}

function finishSession(){
  const dt=getDT();const dv=SESS.dayVariant;
  const type=dt==='training'?`Training — Day ${dv}`:dt==='hiit'?'HIIT + Skill':dt==='ball'?'Basketball + Skill':'Plyo + Accessory';
  const comments={};Object.keys(SESS.setData).forEach(k=>{if(k.endsWith('-comment')&&SESS.setData[k])comments[k.replace('-comment','')]=SESS.setData[k];});
  const exData=collectExData();
  const startTime=SESS.startTime||new Date().toISOString();

  if(editingIndex!==null){
    const existing=ST.sessions[editingIndex];
    ST.sessions[editingIndex]={...existing,exCount:Object.keys(SESS.exDone).length,comments,exData,sessionNote:SESS.sessionNote||''};
  } else {
    ST.sessions.push({date:startTime,startTime,type,dayType:dt,dayVariant:dv,exCount:Object.keys(SESS.exDone).length,comments,exData,sessionNote:SESS.sessionNote||''});
    if(dt==='training')ST.trainAltIndex++;else if(dt!=='rest')ST.offAltIndex++;
  }

  SESS={active:false,exDone:{},setData:{},startTime:null,dayType:null,dayVariant:null,sessionNote:''};
  extraSets={};removedSets={};
  const wasEditing=editingIndex!==null;
  editingIndex=null;
  persist();
  switchTab(wasEditing?'history':'dash');
  setTimeout(()=>alert(wasEditing?'Session updated.':'Session saved. Great work.'),100);
}

function renderDash(){
  const dt=getDT();
  const dv=SESS.active?SESS.dayVariant:trainVariant();
  const today=new Date(),last=ST.sessions[ST.sessions.length-1];
  const isStaleSession=SESS.active&&SESS.dayType&&SESS.dayType!==computeDT();
  let badge='rest',title='Full rest',sub='Recovery only. See you tomorrow.',rows=[];
  if(dt==='training'){
    badge='train';
    const legEx = dv==='A'?'ATG split squat':dv==='B'?'Hack squat':'Goblet squat';
    const hamEx = dv==='C'?'Nordic curl':dv==='A'?'Single leg RDL':'Barbell RDL';
    const upperEx = (dv==='A')?'Pull ups + TRX rows':'Pike push ups + Dips';
    title=DAYS[today.getDay()]+' — Full body (Day '+dv+')';
    sub='Legs: '+legEx+' + '+hamEx+' · Upper: '+upperEx;
    rows=[{n:'Warm up',b:'Warm',id:'wu0'},{n:'Tibialis raises',b:'B1',id:'b10'},{n:'Patrick step + Isometric hold',b:'B1',id:'patrick',acl:true},{n:legEx,b:'B1',id:'sq0',alt:dv},{n:hamEx,b:'B1',id:'rdl0',alt:dv},{n:upperEx.split(' + ')[0],b:'B2',id:'b20'},{n:upperEx.split(' + ')[1],b:'B2',id:'b21'},{n:'Core: Dead bug/Copenhagen/Hyperext/Glute',b:'B3',id:'b30'}];
  }

  } else if(dt==='ball'){

const EX_NAMES={'wu0':'Leg swings','wu1':'Hip circles','wu2':'Cat camels','wu3':'Squat sky reaches','wu4':'Wrist prep','wu5':'Dead bug warmup','b10':'Tibialis raises — standing','b11':'Tibialis raises — seated','patrick':'Patrick step','isoHold':'Isometric knee hold','sq_atg':'ATG split squat','sq_hack':'Hack squat','sq_goblet':'Goblet squat','rdl_single':'Single leg RDL','rdl_barbell':'Barbell RDL','nordic_curl':'Nordic curl','b20':'Pull ups / Pike push ups','b21':'TRX rows / Dips','b30':'Dead bug','b31':'Copenhagen plank','b32':'Hyperextensions','b33':'Glute bridge / hip thrust','lsit':'L-sit maintenance','handstand':'Wall handstand hold','fa0':'Wrist curls','fa1':'Reverse wrist curls','fa2':'Wrist rotation','fa3':'Brachioradialis raises','fa4':'Farmers hold','cf0':'Calf raise — straight','cf1':'Calf raise — inward','cf2':'Calf raise — outward','cf3':'Calf raise — bilateral','cf4':'Calf raise — bodyweight','cfTrim0':'Calf raise (Saturday trimmed)','alt_calf':'Bent knee calf raise','alt_hipflexor':'Hip flexor KB raise','gl0':'Lateral band walks','ad0':'Adductor pull','py0':'Pogo hops','py1':'Low box step-downs','py2':'Lateral bounds','py3':'Ankle hops','hi0':'HIIT — Spin bike','ba0':'Basketball'};

let chartRange='all';let chartExId='';

function getFilteredSessions(range){if(range==='all')return ST.sessions;const weeks=range==='4w'?4:range==='8w'?8:16;const cutoff=new Date();cutoff.setDate(cutoff.getDate()-weeks*7);return ST.sessions.filter(s=>new Date(s.date)>=cutoff);}

function setRangeActive(el){document.querySelectorAll('.range-opt').forEach(o=>o.classList.remove('on'));el.classList.add('on');}

function renderChartContent(){
  const el=document.getElementById('chartContent');if(!el)return;
  if(!chartExId){el.innerHTML='<div class="chart-wrap"><div class="chart-empty">Select an exercise above to see progression</div></div>';return;}
  const sessions=getFilteredSessions(chartRange).filter(s=>s.exData&&s.exData[chartExId]&&s.exData[chartExId].sets&&s.exData[chartExId].sets.length);
  if(!sessions.length){el.innerHTML='<div class="chart-wrap"><div class="chart-empty">No data for this exercise in the selected range</div></div>';return;}
  const dataPoints=sessions.map(s=>{const sets=s.exData[chartExId].sets.filter(st=>st.r||st.w);const bestW=sets.reduce((best,st)=>parseFloat(st.w||0)>parseFloat(best.w||0)?st:best,sets[0]||{});const bestR=sets.reduce((best,st)=>parseInt(st.r||0)>parseInt(best.r||0)?st:best,sets[0]||{});return{date:new Date(s.date),w:parseFloat(bestW.w||0),r:parseInt(bestR.r||0),label:new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})};});
  const hasWeight=dataPoints.some(d=>d.w>0);const hasReps=dataPoints.some(d=>d.r>0);
  const W=340,H=160,PL=36,PR=12,PT=12,PB=28;const chartW=W-PL-PR,chartH=H-PT-PB;const n=dataPoints.length;
  function makeLine(vals){const min=Math.min(...vals),max=Math.max(...vals);const range=max-min||1;const pts=vals.map((v,i)=>{const x=PL+(n===1?chartW/2:i*chartW/(n-1));const y=PT+chartH-(v-min)/range*chartH;return{x,y,v};});const path=pts.map((p,i)=>(i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`)).join(' ');const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="currentColor"><title>${p.v}</title></circle>`).join('');const yLabels=[min,max].map(v=>{const y=PT+chartH-(v-min)/range*chartH;return`<text x="${PL-4}" y="${y+4}" text-anchor="end" class="chart-axis-label">${v}</text>`;}).join('');return{path,dots,yLabels};}
  let svgContent='';const xLabels=dataPoints.map((d,i)=>{const x=PL+(n===1?chartW/2:i*chartW/(n-1));return`<text x="${x}" y="${H-4}" text-anchor="middle" class="chart-axis-label">${d.label}</text>`;}).join('');
  const grid=[0.25,0.5,0.75,1].map(p=>`<line x1="${PL}" y1="${PT+chartH*(1-p)}" x2="${W-PR}" y2="${PT+chartH*(1-p)}" stroke="#2e3248" stroke-width="0.5"/>`).join('');
  if(hasWeight){const wLine=makeLine(dataPoints.map(d=>d.w));svgContent+=`<path d="${wLine.path}" stroke="#4f8ef7" stroke-width="2" fill="none"/><g style="color:#4f8ef7">${wLine.dots}</g>${wLine.yLabels}`;}
  if(hasReps){const rLine=makeLine(dataPoints.map(d=>d.r));svgContent+=`<path d="${rLine.path}" stroke="#3ecf8e" stroke-width="2" fill="none" stroke-dasharray="${hasWeight?'4,3':'none'}"/><g style="color:#3ecf8e">${rLine.dots}</g>`;}
  const legend=(hasWeight?`<div class="chart-legend-item" style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)"><div style="width:8px;height:8px;border-radius:50%;background:#4f8ef7"></div>Weight (lb)</div>`:'')+(hasReps?`<div class="chart-legend-item" style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)"><div style="width:8px;height:8px;border-radius:50%;background:#3ecf8e"></div>Reps${hasWeight?' (dashed)':''}</div>`:'');
  el.innerHTML=`<div class="chart-wrap"><div class="chart-title">${EX_NAMES[chartExId]||chartExId} — Progression</div><svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">${grid}${xLabels}${svgContent}</svg><div style="display:flex;gap:12px;margin-top:8px">${legend}</div></div>`;
}

function renderVolumeChart(){
  const el=document.getElementById('volChart');if(!el)return;
  const sessions=getFilteredSessions(chartRange);if(!sessions.length){el.innerHTML='';return;}
  const W=340,H=120,PL=28,PR=12,PT=12,PB=24;const chartW=W-PL-PR,chartH=H-PT-PB;const n=sessions.length;
  const counts=sessions.map(s=>s.exCount||0);const max=Math.max(...counts)||1;const barW=Math.max(4,Math.floor(chartW/n)-2);
  const bars=sessions.map((s,i)=>{const x=PL+i*(chartW/n);const h=Math.max(2,(counts[i]/max)*chartH);const y=PT+chartH-h;const label=new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric'});return`<rect x="${x+1}" y="${y}" width="${barW}" height="${h}" class="vol-bar" rx="2"><title>${label}: ${counts[i]} exercises</title></rect>`;}).join('');
  const xLabels=n<=8?sessions.map((s,i)=>{const x=PL+i*(chartW/n)+barW/2;return`<text x="${x}" y="${H-4}" text-anchor="middle" class="chart-axis-label">${new Date(s.date).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`;}).join(''):'';
  el.innerHTML=`<div class="chart-wrap"><div class="chart-title">Session volume — exercises completed</div><svg viewBox="0 0 ${W} ${H}" width="100%">${bars}${xLabels}</svg></div>`;
}

async function sendMsg(){
  const inp=document.getElementById('chatInp');const msg=inp?.value.trim();if(!msg)return;
  if(!ST.apiKey){alert('Add your API key in Settings first.');return;}
  inp.value='';ST.chat.push({r:'u',c:msg});persist();
  const cw=document.getElementById('chatWrap');if(cw){cw.innerHTML+=`<div class="msg-user">${msg}</div><div class="msg-coach" id="loading" style="color:var(--text2);font-style:italic">Thinking...</div>`;cw.scrollTop=cw.scrollHeight;}
  const btn=document.getElementById('chatSend');if(btn)btn.disabled=true;
  const recent=ST.sessions.slice(-10).map(s=>`${new Date(s.date).toLocaleDateString()} — ${s.type} — ${s.exCount} exercises`).join('\n');
  const sys=`You are a direct personal training coach for someone recovering from ACL reconstruction (3 years post-op, graft fully mature), now in Phase 3 of their program. Goal: lean bulk, strength/power/skill over aesthetics. Fasting 16:8. HIIT at 8am fasted.

PHASE 3 STRUCTURE: Training days rotate A/B/C (not just A/B anymore). Day A: ATG split squat + Single leg RDL + Pull ups/TRX rows superset. Day B: Hack squat + Barbell RDL + Pike push ups/Dips. Day C (NEW): Goblet squat (front-loaded KB, heels elevated) + Nordic curl (replaces RDL that day only, assisted/partial-range, closing the knee-flexion hamstring gap) + upper rotates A/B pattern.
SET VOLUME CHANGE: Hack squat, Barbell RDL, Single leg RDL, Goblet squat all reduced to 2 sets (down from 3) — primary bilateral/strength lifts, fewer higher-intent sets. Patrick step and ATG split squat STAY AT 3 SETS PERMANENTLY — these are tendon-conditioning/rehab work, not pure strength volume, exempt from the reduction.
SKILL FOCUS SHIFT: L-sit consolidated to ONE exercise (full hold only, single-leg progression dropped) — now MAINTENANCE only (hold past 10 sec), having plateaued cleanly at 10 sec across 3 sessions. NEW primary skill: wall-supported handstand hold, 3x10sec to start. Muscle-up explicitly shelved/paused, pursued informally outside the program only.
SATURDAY RESTRUCTURED: Stretching moved OUT of Saturday entirely into its own flexible, on-demand tab — no longer tied to any day. Saturday now: Plyo (pogo hops, low box step-downs, lateral bounds, ankle hops — 2 sets each) → trimmed calf (1-2 sets, right after plyo, shared tendon structures) → forearm (unchanged) → glute/band walks/adductor.
CRITICAL GATING CONDITION: Box step-downs and lateral bounds (both loading ACL leg with landing/cutting demand) must NOT begin until Patrick step and ATG split squat have shown 1-2 clean, fatigue-free sessions after the Phase 2 break. Pogo hops and ankle hops are lower-risk and more flexible on timing.

PHASE 2 CLOSING CONTEXT: Phase 2 ended with a clear ACL leg fatigue signal (Sept 21) — Patrick step described as "really hard on the ACL leg, fatigued, shaking, even with a 2-day break," ATG split squat skipped entirely that session. This followed a platform increase to 8" three weeks prior. A one-week break was taken in response — the leg now reports fully recovered, approaching Phase 3 cautiously.

BESTS FROM PHASE 2: Pull ups fully unassisted, Hack squat 35lb/6reps (4 sessions clean), Barbell RDL 80lb/8reps, L-sit 10sec hold x3 sets (plateaued, now consolidated), Farmers hold 106lb/40sec, Calf straight 140lb, Calf bilateral 270lb, Patrick step corrected hip-squaring fault and progressed to 8" platform.

UNRESOLVED FROM PHASE 2 — STILL A PRIORITY: Glute bridge, lateral band walks, adductor pulls remain almost entirely unlogged (band walks: zero sessions in 11 weeks). The set-volume reduction elsewhere is explicitly intended to free up time/capacity for these. If this pattern continues into Phase 3, flag it directly and proactively.

function renderSettings(){
  document.getElementById('p-settings').innerHTML=`
    <div class="card"><div class="card-title">Storage</div><div class="srow"><div><div class="slbl">localStorage</div><div class="ssub">Permanent on Safari home screen</div></div><span class="status-on">✓ Active</span></div><div class="srow" style="border:none"><div><div class="slbl">Autosave</div><div class="ssub">Every action saves instantly</div></div><span class="status-on">✓ On</span></div></div>
    <div class="card"><div class="card-title">Phase</div><div class="phase-toggle">${PHASES.map((p,i)=>`<div class="phase-opt${ST.phase===i?' on':''}" onclick="setPhase(${i})">${p.label}</div>`).join('')}</div><div style="font-size:12px;color:var(--text3)">Current: ${PHASES[ST.phase]?.name} phase.</div></div>
    <div class="card"><div class="card-title">API key</div><input type="password" class="api-inp" id="settKey" placeholder="sk-ant-..." value="${ST.apiKey||''}"><button class="api-save" onclick="saveApiSett()">Save key</button></div>
    <div class="card"><div class="card-title">Stats</div><div class="srow"><div class="slbl">Sessions logged</div><span class="sval">${ST.sessions.length}</span></div><div class="srow"><div class="slbl">Current streak</div><span class="sval">${calcStreak()} days</span></div><div class="srow"><div class="slbl">Training rotation index</div><span class="sval">${ST.trainAltIndex} (Day ${trainVariant()} today)</span></div><div class="srow" style="border:none"><div class="slbl">Off day alt index</div><span class="sval">${ST.offAltIndex} (${offAltV()} today)</span></div></div>
    <div class="card"><div class="card-title">Export and import</div><div style="font-size:12px;color:var(--text2);margin-bottom:10px">Export weekly as backup.</div><div class="export-grid"><button class="export-btn" onclick="exportJSON()">📤 Export JSON</button><button class="export-btn" onclick="exportReport()">📄 Export report</button><button class="export-btn" onclick="copyData()">📋 Copy data</button><button class="export-btn" onclick="triggerImport()">📥 Import JSON</button></div><input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)"></div>
    <button class="btn btn-danger" onclick="clearData()">🗑 Clear all session data</button>`;
}

function setPhase(i){ST.phase=i;persist();renderSettings();}
function saveApiSett(){const k=document.getElementById('settKey')?.value.trim();if(!k)return;ST.apiKey=k;persist();alert('API key saved.');}

function downloadBlob(content, filename, mime){
  const blob=new Blob([content],{type:mime});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportJSON(){downloadBlob(JSON.stringify({state:ST,session:SESS},null,2),'grind_'+new Date().toISOString().split('T')[0]+'.json','application/json');}
function exportReport(){const lines=['Grind Report',new Date().toLocaleString(),'','Sessions: '+ST.sessions.length,'','=== HISTORY ==='];ST.sessions.forEach(s=>lines.push(new Date(s.date).toLocaleDateString()+' — '+s.type+' — '+s.exCount+' exercises'+(s.sessionNote?' — Note: '+s.sessionNote:'')));downloadBlob(lines.join('\n'),'grind_report_'+new Date().toISOString().split('T')[0]+'.txt','text/plain');}
function copyData(){navigator.clipboard?.writeText(JSON.stringify({state:ST,session:SESS},null,2)).then(()=>alert('Copied.')).catch(()=>alert('Use Export JSON.'));}
function triggerImport(){document.getElementById('importFile')?.click();}
function importData(input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=function(e){try{const d=JSON.parse(e.target.result);if(d.state)ST={...ST,...d.state};if(d.session?.active)SESS={...SESS,...d.session};persist();renderSettings();renderDash();alert('Imported. '+ST.sessions.length+' sessions restored.');}catch(err){alert('Import failed.');}};r.readAsText(file);}
function clearData(){if(!confirm('Clear all session data?'))return;ST.sessions=[];ST.chat=[];ST.trainAltIndex=0;ST.offAltIndex=0;SESS={active:false,exDone:{},setData:{},startTime:null,dayType:null,dayVariant:null,sessionNote:''};extraSets={};removedSets={};editingIndex=null;persist();renderSettings();renderDash();alert('Cleared.');}

loadData();
renderDash();
